<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- ==========================================================================
         1 - CONFIGURAÇÕES
         ========================================================================== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 TOP CORTE ANIME - Catálogo Profissional de Animes</title>
    
    <!-- Fonte Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- ==========================================================================
         2 - CSS (ESTILOS VISUAIS E RESPONSIVIDADE)
         ========================================================================== -->
    <style>
        /* Variáveis de Cores e Estilo Neon */
        :root {
            --bg-dark: #0a0a0c;
            --bg-card: #121218;
            --bg-card-hover: #1a1a24;
            --primary-neon: #a855f7;
            --primary-neon-glow: rgba(168, 85, 247, 0.6);
            --secondary-neon: #00f0ff;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-neon: rgba(168, 85, 247, 0.3);
            --border-hover: rgba(0, 240, 255, 0.6);
            --badge-ongoing: #10b981;
            --badge-finished: #ef4444;
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Resets Básicos */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Scrollbar Personalizada */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary-neon);
            border-radius: 4px;
            box-shadow: 0 0 10px var(--primary-neon-glow);
        }

        /* Utilitários de Animação e Neon */
        .neon-text {
            color: #fff;
            text-shadow: 
                0 0 5px var(--primary-neon),
                0 0 10px var(--primary-neon),
                0 0 20px var(--primary-neon-glow);
        }

        .neon-box {
            border: 1px solid var(--border-neon);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.15);
        }

        /* Layout Global */
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 20px;
            width: 100%;
        }

        /* Header / Cabeçalho */
        header {
            background: rgba(10, 10, 12, 0.95);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border-neon);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            text-decoration: none;
        }

        .logo i {
            font-size: 2rem;
            color: var(--primary-neon);
            filter: drop-shadow(0 0 8px var(--primary-neon-glow));
        }

        .logo h1 {
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Menu de Navegação */
        nav ul {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 20px;
        }

        nav a:hover, nav a.active {
            color: #fff;
            background: rgba(168, 85, 247, 0.15);
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.2);
        }

        /* Hero / Seção de Pesquisa */
        .hero {
            padding: 40px 0 20px 0;
            text-align: center;
            background: radial-gradient(circle at top, rgba(168, 85, 247, 0.12) 0%, rgba(10, 10, 12, 0) 70%);
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-top: 8px;
        }

        /* Barra de Busca e Filtros */
        .search-filter-section {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .search-box {
            position: relative;
            width: 100%;
            max-width: 600px;
        }

        .search-box input {
            width: 100%;
            padding: 16px 20px 16px 50px;
            background: var(--bg-card);
            border: 2px solid var(--border-neon);
            border-radius: 30px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: var(--transition-smooth);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
        }

        .search-box input:focus {
            border-color: var(--secondary-neon);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }

        .search-box i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-neon);
            font-size: 1.2rem;
        }

        .filter-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-filter {
            background: var(--bg-card);
            border: 1px solid var(--border-neon);
            color: var(--text-muted);
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: var(--transition-smooth);
        }

        .btn-filter:hover, .btn-filter.active {
            background: var(--primary-neon);
            color: #fff;
            border-color: var(--primary-neon);
            box-shadow: 0 0 12px var(--primary-neon-glow);
        }

        /* Infos Globais e Contadores */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 30px 0 20px 0;
            padding: 12px 20px;
            background: rgba(18, 18, 24, 0.6);
            border-radius: 10px;
            border-left: 4px solid var(--primary-neon);
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* Grade de Cards */
        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }

        /* Card do Anime */
        .anime-card {
            background: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border-neon);
            transition: var(--transition-smooth);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .anime-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: var(--secondary-neon);
            box-shadow: 0 10px 25px rgba(0, 240, 255, 0.25);
            background: var(--bg-card-hover);
        }

        .card-cover-wrapper {
            position: relative;
            width: 100%;
            height: 340px;
            overflow: hidden;
        }

        .card-cover {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition-smooth);
        }

        .anime-card:hover .card-cover {
            transform: scale(1.08);
        }

        .card-badge-status {
            position: absolute;
            top: 12px;
            right: 12px;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            backdrop-filter: blur(5px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        .status-em-lancamento {
            background: rgba(16, 185, 129, 0.85);
            color: #fff;
        }

        .status-finalizado {
            background: rgba(239, 68, 68, 0.85);
            color: #fff;
        }

        .btn-fav {
            position: absolute;
            top: 12px;
            left: 12px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(10, 10, 12, 0.7);
            border: 1px solid var(--border-neon);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition-smooth);
            backdrop-filter: blur(5px);
        }

        .btn-fav:hover, .btn-fav.active {
            color: #ef4444;
            background: rgba(255, 255, 255, 0.9);
            border-color: #ef4444;
            transform: scale(1.1);
        }

        .card-content {
            padding: 18px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 10px;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 2.6em;
        }

        .card-meta {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .card-meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-score {
            color: #fbbf24;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-details {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary-neon), #7e22ce);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        .btn-details:hover {
            box-shadow: 0 0 15px var(--primary-neon-glow);
            filter: brightness(1.2);
        }

        /* Página de Detalhes Dinâmica */
        .details-page {
            display: none;
            padding: 30px 0;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-card);
            border: 1px solid var(--border-neon);
            color: var(--text-main);
            padding: 10px 22px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            margin-bottom: 30px;
            transition: var(--transition-smooth);
        }

        .btn-back:hover {
            border-color: var(--secondary-neon);
            color: var(--secondary-neon);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }

        .details-wrapper {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 40px;
            background: var(--bg-card);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid var(--border-neon);
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        .details-cover {
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 0 20px var(--primary-neon-glow);
            object-fit: cover;
        }

        .details-info h2 {
            font-size: 2.2rem;
            font-weight: 900;
            margin-bottom: 15px;
        }

        .genres-list {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .genre-badge {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--secondary-neon);
            color: var(--secondary-neon);
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .details-grid-meta {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            background: rgba(10, 10, 12, 0.6);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .meta-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .meta-item span {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .meta-item strong {
            font-size: 0.95rem;
            color: #fff;
        }

        .details-section-title {
            font-size: 1.2rem;
            color: var(--secondary-neon);
            margin: 25px 0 12px 0;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
        }

        .synopsis {
            color: #d1d5db;
            line-height: 1.7;
            font-size: 0.95rem;
        }

        .info-box-extra {
            background: rgba(168, 85, 247, 0.05);
            border-left: 3px solid var(--primary-neon);
            padding: 15px;
            border-radius: 0 8px 8px 0;
            margin-top: 15px;
            color: #e5e7eb;
            font-size: 0.9rem;
        }

        /* Mensagem de Vazio / Não Encontrado */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            grid-column: 1 / -1;
        }

        .empty-state i {
            font-size: 3.5rem;
            color: var(--primary-neon);
            margin-bottom: 15px;
        }

        /* Loading Animation */
        .loading-spinner {
            display: none;
            justify-content: center;
            align-items: center;
            padding: 50px 0;
            grid-column: 1 / -1;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid var(--bg-card);
            border-top: 5px solid var(--primary-neon);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            box-shadow: 0 0 15px var(--primary-neon-glow);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Botão Voltar ao Topo */
        .btn-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 45px;
            height: 45px;
            background: var(--primary-neon);
            color: #fff;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px var(--primary-neon-glow);
            transition: var(--transition-smooth);
            z-index: 900;
        }

        .btn-top:hover {
            transform: scale(1.15);
            background: var(--secondary-neon);
            color: #000;
        }

        /* Rodapé */
        footer {
            margin-top: auto;
            background: #060608;
            border-top: 1px solid var(--border-neon);
            padding: 40px 0 20px 0;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 25px;
        }

        .footer-bottom {
            text-align: center;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.8rem;
        }

        /* ==========================================================================
           RESPONSIVIDADE (MOBILE & TABLET)
           ========================================================================== */
        @media (max-width: 900px) {
            .details-wrapper {
                grid-template-columns: 1fr;
            }
            .details-cover {
                max-width: 280px;
                margin: 0 auto;
                display: block;
            }
        }

        @media (max-width: 600px) {
            .header-content {
                flex-direction: column;
                gap: 15px;
            }
            .logo h1 {
                font-size: 1.3rem;
            }
            .stats-bar {
                flex-direction: column;
                gap: 8px;
                text-align: center;
            }
            .anime-grid {
                grid-template-columns: repeat(auto-fill, minmax(100%, 1fr));
            }
            .details-info h2 {
                font-size: 1.6rem;
            }
            .details-wrapper {
                padding: 18px;
            }
        }
    </style>
</head>
<body>

    <!-- ==========================================================================
         3 - ESTRUTURA DO SITE (HTML5)
         ========================================================================== -->

    <!-- Cabeçalho Principal -->
    <header>
        <div class="container header-content">
            <a class="logo" onclick="mostrarCatalogo()">
                <i class="fa-solid fa-clapperboard"></i>
                <h1 class="neon-text">TOP CORTE ANIME</h1>
            </a>
            <nav>
                <ul>
                    <li><a href="#" id="nav-home" class="active" onclick="mostrarCatalogo()"><i class="fa-solid fa-house"></i> Início</a></li>
                    <li><a href="#" id="nav-favs" onclick="mostrarFavoritos()"><i class="fa-solid fa-heart"></i> Favoritos</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="container"
