 boss:null, entrance:null, worldSize:3000, cam:{x:1500,y:1500}, shakeT:0, shakeMax:.8,
 p:null, player:null, enemies:[], bullets:[], parts:[], items:[], allies:[], texts:[], decals:[], lights:[],
 markers:[], beams:[], spinners:[], curses:[], arcSwings:[], drops:[],
 kills:0, earned:{kills:0,coins:0,gems:0,xp:0,keys:0,bosses:0},
 mods:{}, event:null, chal:null, loadout:['smg'], unlockedLevel:1,
 hour:8, dayT:0, night:0, weather:'clear', wT:0, lightning:0, slowT:0, magnetT:0, xpMulT:0,
 hitFlash:0, revUsed:false, revTimer:0, pendingLevels:0, diffT:0, spawnT:0, eliteT:0, survT:0,
 cruiseMode:false, set:SAVE_DEF.set, modsDark:false
};
P.Game=G;
/* --- mods combinados (modo + evento + desafio diario) --------------- */
function buildMods(){
 const m={};
 const add=o=>{for(const k in o)m[k]=o[k];};
 if(G.chal)add(G.chal.mod);
 if(G.event)add(G.event.mod);
 G.mods=m;G.modsDark=!!m.dark;
}
function activeEvent(){const d=new Date().getDay();for(const e of EVENTS)if(e.days.indexOf(d)>=0)return e;return null;}
function dailyChallenge(){
 const k=dkey(),n=parseInt(k.replace(/-/g,''),10),r=mulberry32(n);
 const ch=CHALS[FL(r()*CHALS.length)];
 const mk=MKEYS[FL(r()*MKEYS.length)];
 return Object.assign({},ch,{map:mk,key:k});
}
function score(){return G.earned.kills*10+G.wave*60+G.earned.bosses*600+G.time*4;}
/* ---------------------------- start ---------------------------------- */
function startRun(mode){
 closeMenusQuiet();
 G.mode=mode;G.runActive=true;G.paused=false;G.screen='play';
 G.time=0;G.simT=0;G.wave=1;G.waveKilled=0;G.waveState='fight';G.waveBreak=0;
 G.kills=0;G.earned={kills:0,coins:0,gems:0,xp:0,keys:0,bosses:0};
 G.enemies.length=0;G.bullets.length=0;G.parts.length=0;G.items.length=0;G.allies.length=0;G.texts.length=0;
 G.markers.length=0;G.beams.length=0;G.spinners.length=0;G.curses.length=0;G.arcSwings.length=0;
 G.boss=null;G.entrance=null;G.revUsed=false;G.revTimer=0;G.pendingLevels=0;
 G.slowT=0;G.magnetT=0;G.xpMulT=0;G.diff=1;G.diffT=0;G.spawnT=0;G.survT=0;G.clock=1;
 G.event=activeEvent();
 G.chal=(mode==='challenge')?dailyChallenge():null;
 buildMods();
 if(mode==='challenge'&&G.chal)G.mapKey=G.chal.map;
 G.map=MAPS[G.mapKey];G.map.lightOff=G.mods.dark?true:false;
 G.worldSize=mode==='boss'?1800:3000;
 G.waves=mode==='campaign'?MX(3,2+FL(G.unlockedLevel/2)):5;
 G.waveTarget=mode==='boss'?0:8;
 buildDecals();buildWeather();
 G.player=computeStats();
 initPlayer();
 G.cam.x=G.p.x;G.cam.y=G.p.y;
 mus.theme=G.map.theme;mus.boss=false;mus.intensity=1;
 ambience(G.map.amb);
 $('mini').classList.toggle('hidden',!G.set.mini);
 banner(MODES[mode].n,G.chal?G.chal.n:(G.event?G.event.ic+' '+G.event.n:MAPS[G.mapKey].name));
 if(mode==='boss'){setTimeout(()=>{if(G.screen==='play')spawnBoss(G.map.boss);},900);}
 if(mode==='challenge')toast('Desafio: '+G.chal.n);
}
function closeMenusQuiet(){$('menus').classList.add('hidden');}
function buildWeather(){
 G.drops=[];
 const n=420;
 for(let i=0;i<n;i++)G.drops.push({x:rnd(GFX.vw),y:rnd(GFX.vh),s:rnd(2.4,.7),v:rnd(1.4,.6)});
 G.weather=G.map.weather[0];G.wT=rnd(G.set.cycle*.35,G.set.cycle*.15);
}
function updateWeather(dt){
 if(!G.set.weather)return;
 G.wT-=dt;
 if(G.wT<=0){G.wT=rnd(G.set.cycle*.5,G.set.cycle*.2);
  const list=G.map.weather;G.weather=pick(list);ambience(G.weather==='rain'||G.weather==='storm'?G.weather:(G.weather==='blizzard'?'blizzard':G.map.amb));}
 const st=G.weather==='storm'||G.weather==='blizzard';
 for(let i=0;i<((G.weather==='snow'||G.weather==='blizzard')?Q().snow:(G.weather==='clear'?0:Q().rain));i++){
  const r=G.drops[i];if(!r)continue;
  r.y+=(r.v*(st?900:620))*dt;r.x-=(G.weather==='sandstorm'?260:120)*dt;
  if(r.y>GFX.vh){r.y=-10;r.x=rnd(GFX.vw);}
  if(r.x<0)r.x=GFX.vw;
 }
 if(G.weather==='storm'&&chance(dt*.35)){G.lightning=1;sfx('thunder');flash(.5,.4,'#cfe6ff');}
 if(G.lightning>0)G.lightning=Math.max(0,G.lightning-dt*3.2);
}
function updateDayNight(dt){
 if(!G.set.daynight){G.night=G.map.night*.6;return;}
 G.dayT+=dt;
 G.hour=(G.hour+dt*(24/G.set.cycle))%24;
 const h=G.hour;
 /* escuridao por hora do dia (picos a noite) */
 let d;
 if(h>=6&&h<8)d=lerp(.6,.15,(h-6)/2);
 else if(h>=8&&h<17)d=.12;
 else if(h>=17&&h<20)d=lerp(.15,.85,(h-17)/3);
 else d=.9;
 G.night=clamp(d*G.map.night+.1,0,.94);
}
function buildDecals(){
 G.decals.length=0;
 const k=G.map.deco,n=G.worldSize;
 for(let i=0;i<120;i++){
  const x=rnd(n-200,200),y=rnd(n-200,200);
  if(k==='city')G.decals.push({k:'bldg',x:x,y:y,w:rnd(150,60),h:rnd(150,60)});
  else if(k==='forest')G.decals.push({k:'tree',x:x,y:y,r:rnd(34,16),c:pick(['#1f5c2e','#2b7a3d','#164d3a'])});
  else if(k==='desert')G.decals.push(chance(.5)?{k:'cactus',x:x,y:y}:{k:'rock',x:x,y:y,r:rnd(26,10),c:'#6b4630'});
  else if(k==='snow')G.decals.push({k:'ice',x:x,y:y,r:rnd(34,14)});
  else if(k==='volcano')G.decals.push(chance(.35)?{k:'lava',x:x,y:y,r:rnd(60,24)}:{k:'rock',x:x,y:y,r:rnd(28,12),c:'#3a1f1a'});
  else if(k==='space')G.decals.push({k:'pod',x:x,y:y,r:rnd(40,16)});
  else if(k==='lab')G.decals.push(chance(.5)?{k:'pod',x:x,y:y,r:rnd(40,14)}:{k:'pillar',x:x,y:y});
 }
}
/* ----------------------------- loop ---------------------------------- */
let last=now(),fpsAcc=0,fpsN=0;
function frame(ts){
 requestAnimationFrame(frame);
 let dt=(ts-last)/1000;last=ts;
 if(dt>.1)dt=.1;
 fpsAcc+=dt;fpsN++;
 if(fpsAcc>=.5){GFX.fps=fpsN/fpsAcc;fpsAcc=0;fpsN=0;adaptQuality(GFX.fps);}
 joyDraw();
 if(G.screen==='play'&&!G.paused){
  G.simT+=dt;
  const cl=(G.mods.clockMul||1)*(G.slowT>0?.45:1);
  G.clock=lerp(G.clock,cl,dt*6);
  const sdt=dt*G.clock;
  G.time+=sdt;
  if(G.slowT>0)G.slowT-=dt;
  if(G.magnetT>0)G.magnetT-=dt;
  if(G.xpMulT>0)G.xpMulT-=dt;
  updateWorld(sdt,dt);
 }else{
  G.simT+=dt*.4;
  if(G.shakeT>0)G.shakeT=Math.max(0,G.shakeT-dt*2);
 }
 render();
 if(G.screen==='play')hud(dt);
 saveT+=dt;if(saveT>=5){saveT=0;flushSave();}
}
function updateWorld(sdt,rawdt){
 G.diffT+=sdt;
 /* dificuldade */
 if(G.mode==='endless'||G.mode==='survival')G.diff=1+G.time/55;
 else if(G.mode==='campaign')G.diff=1+(G.unlockedLevel-1)*.16+G.wave*.06;
 else if(G.mode==='challenge')G.diff=1.15+G.time/80;
 else if(G.mode==='boss')G.diff=1+(G.unlockedLevel-1)*.1;
 updateWeather(rawdt);updateDayNight(rawdt);
 updatePlayer(sdt);
 updateEnemies(sdt);
 updateBullets(sdt);
 updateParts(rawdt);
 updateItems(rawdt);
 updateAllies(rawdt);
 updateHazards(sdt);
 updateEntrance(rawdt);
 updateSpawner(sdt);
 /* camera suavizada + leve olhe para a mira */
 const tx=G.p.x+(In.aim.on&&In.aim.id>=0?(In.aim.x-GFX.vw/2)*.18:0);
 const ty=G.p.y+(In.aim.on&&In.aim.id>=0?(In.aim.y-GFX.vh/2)*.18:0);
 G.cam.x=lerp(G.cam.x,tx,rawdt*7);G.cam.y=lerp(G.cam.y,ty,rawdt*7);
 if(G.shakeT>0)G.shakeT=Math.max(0,G.shakeT-rawdt*1.9);
 if(G.hitFlash>0)G.hitFlash=Math.max(0,G.hitFlash-rawdt*3);
 G.lights.length=Math.min(G.lights.length,40);
 for(let i=G.lights.length-1;i>=0;i--){const L=G.lights[i];L.life-=rawdt;if(L.life<=0)G.lights.splice(i,1);}
 for(let i=G.arcSwings.length-1;i>=0;i--){const a=G.arcSwings[i];a.life-=rawdt;if(a.life<=0)G.arcSwings.splice(i,1);}
 /* audio adaptativo */
 mus.intensity=clamp(.6+G.enemies.length/26+(G.boss?.6:0),.6,1.6);
 /* subida de nivel */
 if(G.pendingLevels>0){G.pendingLevels--;sfx('level');if(G.screen==='play')levelUpScreen();}
 checkWave(sdt);
 if(G.mode==='survival')G.survT=G.time;
 /* consumiveis do inventario (toque duplo no botao de pausa segura) */
 if(G.p&&G.p.hp>0&&chance(rawdt*.16))tryUseConsumable();
 save.stats.dmg+=0;
}
function updateHazards(sdt){
 /* marcadores de ataque de chefe */
 for(let i=G.markers.length-1;i>=0;i--){
  const m=G.markers[i];m.life-=sdt;
  if(m.line){ /* investida do tanque */
   const a=Math.atan2(m.line.to.y-m.y,m.line.to.x-m.x);
   if(m.life<=0){/* nada: handled by leap */}
  }
  if(m.life<=0){
   explode(m.x,m.y,m.r,m.col,m.col==='#ff5a3c'?18:12);
   if(G.p&&dst(G.p.x,G.p.y,m.x,m.y)<m.r)hurtPlayer(14,m.col);
   G.markers.splice(i,1);
  }
 }
 /* feixes rotativos */
 for(let i=G.beams.length-1;i>=0;i--){
  const b=G.beams[i];b.life-=sdt;b.a+=b.spin*sdt;
  b.x=G.boss?G.boss.x:b.x;b.y=G.boss?G.boss.y:b.y;
  const dx=COS(b.a),dy=SIN(b.a);
  for(let k=20;k<b.len;k+=22){
   const px=b.x+dx*k,py=b.y+dy*k;
   if(G.p&&!G.p.invuln&&G.p.iframe<=0&&Math.abs((G.p.y-py)*dx-(G.p.x-px)*dy)<b.w&&dst(b.x,b.y,G.p.x,G.p.y)<b.len){
    hurtPlayer(b.dmg*sdt*6,b.col);break;}
  }
  if(chance(sdt*30))part({x:b.x+dx*rnd(b.len,40),y:b.y+dy*rnd(b.len,40),life:.3,size:3,col:b.col,type:'spark'});
  if(b.life<=0)G.beams.splice(i,1);
 }
 /* espirais */
 for(let i=G.spinners.length-1;i>=0;i--){
  const s=G.spinners[i];s.life-=sdt;s.a+=s.spin*sdt;s.cd-=sdt;
  if(s.cd<=0&&G.boss){s.cd=.09;
   for(let k=0;k<2;k++){const a=s.a+k*PI;
    shoot({x:G.boss.x,y:G.boss.y,vx:COS(a)*380,vy:SIN(a)*380,dmg:s.dmg,r:6,col:s.col,life:2.4,src:'e'});}}
  if(s.life<=0)G.spinners.splice(i,1);
 }
 /* maldicoes / zonas */
 for(let i=G.curses.length-1;i>=0;i--){
  const z=G.curses[i];z.life-=sdt;
  z.x=lerp(z.x,G.p.x,sdt*.9);z.y=lerp(z.y,G.p.y,sdt*.9);
  if(G.p&&dst(G.p.x,G.p.y,z.x,z.y)<z.r){hurtPlayer(z.dmg*sdt,z.col);if(z.freeze)G.p.vx*=.9;}
  if(chance(sdt*30))part({x:z.x+rnd(z.r,-z.r),y:z.y+rnd(z.r,-z.r),life:.5,size:3,col:z.col,type:'spark',vy:-30});
  if(z.life<=0)G.curses.splice(i,1);
 }
 /* decals de lava queimam */
 for(let i=G.decals.length-1;i>=0;i--){
  const d=G.decals[i];if(d.k!=='lava'||!d.life)continue;
  d.life-=sdt;
  if(G.p&&dst(G.p.x,G.p.y,d.x,d.y)<d.r)hurtPlayer(6*sdt,'#ff5a1a');
  if(d.life<=0)G.decals.splice(i,1);
 }
}
function tryUseConsumable(){/* atalho auto: usa pocao se vida critica e houver no estoque */
 const p=G.p;if(p.hp>p.hpMax*.3)return;
 if((save.inv.potion||0)>0&&G.screen==='play'){save.inv.potion--;markSave();healPlayer(p.hpMax*.55);sfx('heal');toast('Poção automática');}
}
function updateSpawner(dt){
 if(G.mode==='boss')return;
 G.spawnT-=dt;
 const cap=MX(14,46-G.enemies.length);
 const rate=MX(.22,(1.5-G.wave*.05-G.time*.004));
 if(G.spawnT<=0&&G.enemies.length<cap){
  G.spawnT=rate/(G.mods.spawnMul||1);
  spawnWave(1+FL(G.wave/4));
 }
 if(G.mods.eliteMul&&(G.time%22)<dt){const pool=G.map.enemies;if(chance(.4))spawnEnemy(pick(pool),{elite:true});}
}
function checkWave(dt){
 if(G.mode==='boss'||G.mode==='endless'||G.mode==='survival')return;
 if(G.waveState==='fight'){
  if(G.waveKilled>=G.waveTarget&&G.enemies.length===0){
   if(G.wave>=G.waves){G.waveState='boss';spawnBoss(G.map.boss);}
   else{G.waveState='break';G.waveBreak=2.6;banner('ONDA '+G.wave+' COMPLETA','Prepare-se');
    save.stats.waves++;G.earned.coins+=40+G.wave*12;sfx('win');}
  }
 }else if(G.waveState==='break'){
  G.waveBreak-=dt;
  if(G.waveBreak<=0){G.wave++;G.waveKilled=0;G.waveTarget=Math.round(G.waveTarget*1.35)+2;G.waveState='fight';
   banner('ONDA '+G.wave+'/'+G.waves);spawnWave(3+G.wave);}
 }else if(G.waveState==='boss'&&!G.boss){
  finishLevel();
 }
}
function finishLevel(){
 const sc=Math.round(score());
 const win=sc>0;
 G.unlockedLevel=MX(G.unlockedLevel,G.unlockedLevel);
 if(G.mode==='campaign'){
  const idx=MKEYS.indexOf(G.mapKey);
  if(idx>=0&&idx+1<MKEYS.length)G.unlockedLevel=MX(G.unlockedLevel,idx+2);
 }
 save.best.campaign=MX(save.best.campaign||0,sc);
 endRun(true);
}

/* =========== 17. NET (estrutura pronta para multijogador) ============= */
/* Nenhuma dependencia: basta trocar ENDPOINT e os metodos viram fetch(). */
const Net={
 ENDPOINT:'',/* ex: https://sua-api.com/pulso */
 rooms:[],peers:[],chat:[],friends:[],
 status(){return this.ENDPOINT?'Endpoint configurado · aguardando servidor':'Modo offline · pronto para plugar API';},
 connect(){if(!this.ENDPOINT)return Promise.resolve(this.status());return fetch(this.ENDPOINT+'/hello').then(r=>r.json()).catch(()=>({err:1}));},
 joinRoom(id){return this._post('/room/'+id+'/join',{nick:save.net.nick});},
 sendChat(msg){this.chat.push({n:save.net.nick,m:msg,t:Date.now()});return this._post('/chat',{m:msg});},
 submitScore(mode,score){return this._post('/score',{mode:mode,score:score,lvl:save.level});},
 leaderboard(mode){return this._get('/leaderboard?mode='+mode);},
 _get(p){if(!this.ENDPOINT)return Promise.resolve([]);return fetch(this.ENDPOINT+p).then(r=>r.json()).catch(()=>[]);},
 _post(p,b){if(!this.ENDPOINT)return Promise.resolve({ok:1,offline:1});
  return fetch(this.ENDPOINT+p,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json()).catch(()=>({ok:0}));}
};
P.Net=Net;
/* Pontos ja ligados ao Net (podem virar rede real sem mexer no jogo): */
function netSubmitScore(){Net.submitScore(G.mode,Math.round(score()));}

/* ========================= 18. BOOT ================================= */
function boot(){
 loadSave();
 G.set=save.set;GFX.q=save.set.quality==='auto'?'high':save.set.quality;
 gfxInit();inputBind();
 G.mapKey='city';G.map=MAPS.city;G.set.mini=G.set.mini!==false;
 $('mini').classList.toggle('hidden',!G.set.mini);
 rollDaily();doLogin();
 G.event=activeEvent();
 buildDecals();buildWeather();
 G.player=computeStats();
 /* cena viva atras do menu: um jogador fantasma + alguns inimigos */
 initPlayer();G.p.hp=G.p.hpMax;
 for(let i=0;i<6;i++)spawnEnemy(pick(['grunt','runner','ghost']),{x:G.p.x+rnd(500,-500),y:G.p.y+rnd(500,-500)});
 home();
 requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)flushSave();});
addEventListener('beforeunload',flushSave);
addEventListener('pointerdown',()=>audioResume(),{once:true});
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
</script>
