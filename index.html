<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<meta name="mobile-web-app-capable" content="yes">
<title>PULSO - Criado por VICTOR OFICIAL</title>
<style>
/* =======================================================================
   PULSO | CSS: UI futurista, touch-first, responsiva
   ======================================================================= */
:root{--c1:#00eaff;--c2:#ff2d95;--c3:#7cff4f;--c4:#ffd166;--c5:#ff7a1a;
 --bg:#05070f;--panel:rgba(9,14,28,.94);--line:rgba(0,234,255,.22);--txt:#dff6ff;--dim:#7f98b3}
*{margin:0;padding:0;-webkit-tap-highlight-color:transparent;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
 font:500 15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
 user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
canvas{display:block;position:fixed;inset:0}
.hidden{display:none!important}
#top{position:fixed;top:0;left:0;right:0;display:flex;gap:5px;align-items:center;padding:calc(6px + env(safe-area-inset-top)) 8px;
 background:linear-gradient(180deg,rgba(3,6,14,.9),transparent);pointer-events:none;flex-wrap:wrap;z-index:5}
.sp{flex:1 1 4px}
.pill{display:flex;align-items:center;gap:5px;background:rgba(6,10,22,.72);border:1px solid var(--line);border-radius:20px;
 padding:3px 8px;font-size:11.5px;font-weight:800;letter-spacing:.3px;pointer-events:auto;white-space:nowrap}
.pill b{color:var(--c1);font-variant-numeric:tabular-nums}
.ico{width:8px;height:8px;border-radius:50%;background:var(--c1);box-shadow:0 0 8px currentColor}
.i-coin{background:var(--c4)}.i-gem{background:var(--c2)}.i-key{background:#cfe3ff}.i-k{background:var(--c3)}
.i-time{background:var(--c1)}.i-lvl{background:var(--c2)}.i-wave{background:var(--c5)}.i-fps{background:#48e5c0}
.i-obj{background:var(--c4)}.i-hp{background:#ff3b5c}.i-sh{background:#0aa6ff}.i-xp{background:var(--c3)}
.bar{position:relative;height:12px;width:34vw;max-width:170px;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:7px;overflow:hidden}
.bar>i{position:absolute;left:0;top:0;bottom:0;width:0%;border-radius:6px;transition:width .1s linear}
#hpF{background:linear-gradient(90deg,#ff3b5c,#ff7a9c)}
#shWrap{display:none}
#shF{background:linear-gradient(90deg,#0aa6ff,#7fe0ff)}
#xpF{background:linear-gradient(90deg,#7cff4f,#c9ff9b)}
button{font:inherit;color:inherit;background:rgba(10,16,32,.8);border:1px solid var(--line);border-radius:12px;padding:9px 14px;
 font-weight:800;letter-spacing:.4px;cursor:pointer;transition:transform .12s,box-shadow .2s,background .2s}
button:active{transform:scale(.94)}
.btn{background:linear-gradient(135deg,rgba(0,234,255,.2),rgba(255,45,149,.16));box-shadow:0 6px 22px rgba(0,0,0,.5)}
.btn.big{font-size:17px;padding:14px 26px;border-radius:16px}
.btn.gh{background:rgba(10,16,32,.6)}
.btn.on{border-color:var(--c3);color:var(--c3)}
.btn.sm{padding:6px 10px;font-size:11.5px;border-radius:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#bossBar{position:fixed;left:50%;transform:translateX(-50%);top:calc(56px + env(safe-area-inset-top));width:min(88vw,540px);z-index:5;pointer-events:none}
#bossBar .nm{text-align:center;font-size:11.5px;letter-spacing:2px;font-weight:900;text-shadow:0 0 12px #000}
#bossBar .out{height:13px;border:1px solid rgba(255,255,255,.3);border-radius:8px;background:rgba(0,0,0,.6);overflow:hidden}
#bossBar .in{height:100%;width:100%;background:linear-gradient(90deg,#ff2d95,#ffd166);transition:width .1s}
#bossBar .ph{text-align:center;font-size:10px;color:var(--dim);letter-spacing:2px}
#joy{position:fixed;left:0;bottom:0;width:54%;height:52%;z-index:4}
#fireZone{position:fixed;right:0;bottom:0;width:46%;height:58%;z-index:3}
#dpad{position:fixed;right:calc(12px + env(safe-area-inset-right));bottom:calc(116px + env(safe-area-inset-bottom));z-index:6;display:grid;gap:7px}
#dpad button{width:48px;height:48px;border-radius:50%;font-size:18px;display:grid;place-items:center;background:rgba(0,234,255,.14)}
#fireBtn{position:fixed;right:calc(16px + env(safe-area-inset-right));bottom:calc(24px + env(safe-area-inset-bottom));width:88px;height:88px;
 border-radius:50%;z-index:6;font-size:12px;font-weight:900;background:radial-gradient(circle at 35% 30%,rgba(255,45,149,.6),rgba(255,45,149,.14));
 border:2px solid rgba(255,45,149,.65)}
#joyLayer{z-index:3;pointer-events:none}
#light{z-index:2;pointer-events:none}
#mini{position:fixed;right:calc(10px + env(safe-area-inset-right));top:calc(52px + env(safe-area-inset-top));z-index:5;
 border:1px solid var(--line);border-radius:10px;background:rgba(3,6,14,.75);opacity:.9}
#fx{position:fixed;inset:0;z-index:4;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,rgba(180,200,255,.04),rgba(4,8,18,.5) 78%)}
#flash{position:fixed;inset:0;z-index:8;pointer-events:none;opacity:0;background:#fff}
#banner{position:fixed;top:32%;left:0;right:0;text-align:center;z-index:7;pointer-events:none;opacity:0;transition:opacity .3s}
#banner .b1{font-size:clamp(20px,7vw,42px);font-weight:900;letter-spacing:3px;text-shadow:0 0 26px var(--c2)}
#banner .b2{font-size:12px;letter-spacing:2px;color:var(--dim)}
#menus{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:10px;
 background:radial-gradient(1100px 640px at 50% 0%,rgba(0,234,255,.12),transparent 60%),rgba(2,4,10,.88);
 backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.sheet{width:min(760px,96vw);max-height:94vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;
 padding:15px 15px calc(18px + env(safe-area-inset-bottom));box-shadow:0 30px 90px rgba(0,0,0,.7);animation:pop .2s ease-out}
@keyframes pop{from{transform:translateY(14px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.sheet h1{font-size:clamp(34px,12vw,64px);letter-spacing:8px;line-height:1;text-align:center;font-weight:900;
 background:linear-gradient(90deg,#00eaff,#ff2d95 55%,#ffd166);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 0 22px rgba(0,234,255,.35))}
.sheet h2{font-size:15px;letter-spacing:2px;margin:12px 0 6px;color:var(--c1);text-transform:uppercase}
.sub{text-align:center;color:var(--dim);font-size:11px;letter-spacing:3px;margin-bottom:12px}
.credit{text-align:center;margin-top:12px;font-size:11.5px;letter-spacing:2px;color:var(--dim)}
.credit b{color:#fff;text-shadow:0 0 14px var(--c2)}
.card{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px;margin-bottom:8px}
.card.on{border-color:var(--c3);box-shadow:0 0 18px rgba(124,255,79,.14)}
.card.lock{opacity:.5}
.card.evt{border-color:rgba(255,209,102,.45);background:linear-gradient(135deg,rgba(255,209,102,.1),rgba(255,122,26,.05))}
.grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.t{font-weight:800;font-size:13.5px;display:flex;justify-content:space-between;gap:6px}
.t s{color:var(--c4);text-decoration:none;font-weight:900}
.d{color:var(--dim);font-size:11px;margin-top:3px}
.pips{display:flex;gap:3px;margin-top:6px}.pips i{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.12)}
.pips i.f{background:linear-gradient(90deg,var(--c4),#fff)}
.list{max-height:50vh;overflow:auto;padding-right:4px}
.setting{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;background:rgba(255,255,255,.04);
 border-radius:12px;margin-bottom:6px;font-size:12.5px;font-weight:700}
.setting input[type=range]{width:42%;accent-color:var(--c1)}
.setting select{background:#0b1428;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:5px;font-size:12px}
.tabs{display:flex;gap:6px;overflow:auto;padding-bottom:8px}
.tabs button{padding:7px 11px;font-size:11.5px;border-radius:10px;white-space:nowrap}
.tabs button.on{border-color:var(--c2);color:var(--c2)}
.stat{display:flex;justify-content:space-between;font-size:12px;padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.06);color:var(--dim)}
.stat b{color:var(--txt)}
.node{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:12px;
 background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);font-size:12.5px;margin-bottom:6px}
.node.max{border-color:var(--c3)}
.sw{position:relative;width:44px;height:24px;flex:0 0 44px}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;background:rgba(255,255,255,.14);border-radius:14px;transition:.2s}
.sw span:after{content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+span{background:linear-gradient(90deg,var(--c1),var(--c2))}
.sw input:checked+span:after{transform:translateX(20px)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom));z-index:26;
 background:rgba(6,10,22,.95);border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-size:12px;font-weight:800;animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}}
.pick{cursor:pointer;transition:transform .14s;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:16px;padding:12px}
.pick:hover,.pick:active{transform:translateY(-3px);border-color:var(--c1)}
.pick .ic{font-size:26px;text-align:center}
.kicker{display:inline-block;font-size:9.5px;letter-spacing:2px;padding:2px 7px;border-radius:20px;background:rgba(255,45,149,.18);color:#ffb3d9}
.lvlbox{position:fixed;inset:0;z-index:22;display:flex;align-items:center;justify-content:center;background:rgba(3,5,12,.9);backdrop-filter:blur(6px);padding:10px}
.mode{display:flex;gap:10px;align-items:center;text-align:left}
.mode .big{font-size:26px}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:rgba(0,234,255,.3);border-radius:3px}
</style>
</head>
<body>
<canvas id="g"></canvas>
<canvas id="light"></canvas>
<canvas id="joyLayer"></canvas>
<canvas id="mini" class="hidden"></canvas>
<div id="fx" class="hidden"></div>
<div id="flash"></div>
<div id="banner"><div class="b1"></div><div class="b2"></div></div>
<div id="top">
 <span class="pill"><i class="ico i-hp"></i><span class="bar"><i id="hpF"></i></span></span>
 <span class="pill" id="shWrap"><i class="ico i-sh"></i><span class="bar" style="width:16vw"><i id="shF"></i></span></span>
 <span class="pill"><i class="ico i-xp"></i><span class="bar" style="width:22vw"><i id="xpF"></i></span><b id="lvlN">1</b></span>
 <span class="sp"></span>
 <span class="pill"><i class="ico i-obj"></i><b id="objN">0</b></span>
 <span class="pill"><i class="ico i-wave"></i><b id="waveN">1</b></span>
 <span class="pill"><i class="ico i-time"></i><b id="timeN">0:00</b></span>
 <span class="pill"><i class="ico i-k"></i><b id="killN">0</b></span>
 <span class="pill"><i class="ico i-coin"></i><b id="coinN">0</b></span>
 <span class="pill"><i class="ico i-gem"></i><b id="gemN">0</b></span>
 <span class="pill"><i class="ico i-key"></i><b id="keyN">0</b></span>
 <span class="pill hidden" id="fpsWrap"><i class="ico i-fps"></i><b id="fpsN">60</b></span>
</div>
<div id="bossBar" class="hidden"><div class="nm"></div><div class="out"><div class="in"></div></div><div class="ph"></div></div>
<div id="ctrlRoot">
 <div id="joy"></div><div id="fireZone"></div>
 <div id="dpad"><button id="dashBtn">&#128168;</button><button id="pauseBtn">&#9208;</button><button id="revBtn" class="hidden">&#10084;&#65039;</button></div>
 <button id="fireBtn">FOGO</button>
</div>
<div id="menus" class="hidden"></div>
<script>
"use strict";
/* =======================================================================
   PULSO 3.0 | jogo mobile HTML5 (canvas 2D) | arquivo unico, offline
   Criado por VICTOR OFICIAL
   -----------------------------------------------------------------------
   ORGANIZACAO (arquivo unico, blocos numerados):
     1 Core | 2 Save | 3 GFX | 4 Audio | 5 Pool | 6 Input | 7 Content
     8 FX | 9 Render | 10 Player | 11 Enemy | 12 Items | 13 Allies
     14 Meta | 15 UI | 16 Game | 17 Net | 18 Boot
   >>> Para ADICIONAR conteudo novo, edite apenas o bloco 7 (Content). <<<
   ======================================================================= */

/* ===================== 1. CORE (utilidades puras) ===================== */
const TAU=Math.PI*2, PI=Math.PI, SIN=Math.sin, COS=Math.cos, AT2=Math.atan2,
 RND=Math.random, FL=Math.floor, MN=Math.max(1,Math.min), MX=Math.max, ABS=Math.abs, HP=Math.hypot;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a=1,b=0)=>b+RND()*(a-b);
const rndi=(a,b)=>FL(b+RND()*(a-b+1));
const pick=a=>a[FL(RND()*a.length)];
const chance=p=>RND()<p;
const dist=(a,b)=>HP(a.x-b.x,a.y-b.y);
const dst=(x1,y1,x2,y2)=>HP(x2-x1,y2-y1);
const ang=(a,b)=>AT2(b.y-a.y,b.x-a.x);
/** gira no caminho mais curto (IA nunca "gira pelas costas") */
function angMove(cur,tgt,max){let d=((tgt-cur+PI)%TAU+TAU)%TAU-PI;return cur+clamp(d,-max,max);}
/** RNG deterministica -> DESAFIO DIARIO identico para todos os jogadores */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hexRgb(h){h=String(h||'#ffffff').replace('#','');if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];const n=parseInt(h,16)||0xffffff;return[n>>16&255,n>>8&255,n&255];}
function rgba(h,a){const c=hexRgb(h);return'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}
function mixc(a,b,t){const x=hexRgb(a),y=hexRgb(b);return'rgb('+FL(lerp(x[0],y[0],t))+','+FL(lerp(x[1],y[1],t))+','+FL(lerp(x[2],y[2],t))+')';}
const now=()=>performance.now();
function dkey(ts){const d=ts?new Date(ts):new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtTime(s){s=MX(0,FL(s));const m=FL(s/60);return(m<10?'':'0')+m+':'+String(s%60).padStart(2,'0');}
function fmtNum(n){n=FL(n||0);if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return''+n;}
function vibrate(p){try{if(save&&save.set.vibration)navigator.vibrate&&navigator.vibrate(p);}catch(e){}}
const easeOut=t=>1-(1-t)*(1-t);
const $=id=>document.getElementById(id);

/* ================= 2. SAVE (salvamento automatico) =================== */
const SAVE_KEY='pulso_save_v3';
const SAVE_DEF={v:3,coins:300,gems:5,keys:1,best:{campaign:0,endless:0,survival:0,challenge:0,boss:0},
 level:1,xp:0,sp:0,char:'nova',ownedChars:['nova'],ownedSkins:['nova_core'],skins:{},
 weapons:{pistol:1},up:{},tree:{},inv:{potion:2,bomb:1,shield:1},cons:{revive:0},
 stats:{kills:0,bosses:0,coins:0,gems:0,runs:0,time:0,distance:0,dmg:0,shots:0,waves:0,daily:0,levels:0,deaths:0,dash:0,keys:0,chest:0},
 ach:{},ms:{},msDay:'',set:{master:80,sfx:80,music:55,ambient:45,quality:'auto',shake:true,light:true,damage:true,
  weather:true,daynight:true,cycle:120,fps:false,cruise:true,autoaim:true,mini:true,vibration:true,particles:100},
 pass:{lvl:0,xp:0,claimed:[]},login:{last:0,streak:0,total:0},
 unlocked:{level:1},net:{nick:'VICTOR'}};
let save=null,saveDirty=false,saveT=0;
function hydrate(a,b){for(const k in b){if(a[k]===undefined)a[k]=JSON.parse(JSON.stringify(b[k]));
 else if(b[k]&&b[k].constructor===Object&&a[k]&&a[k].constructor===Object)hydrate(a[k],b[k]);}return a;}
function loadSave(){try{save=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');}catch(e){save=null;}
 if(!save)save={}; save=hydrate(save,JSON.parse(JSON.stringify(SAVE_DEF))); save.v=3; return save;}
function markSave(){saveDirty=true;}
function flushSave(){if(!saveDirty)return;saveDirty=false;try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}}

/* ============ 3. GFX (canvas / resolucao / qualidade grafica) ========= */
const GFX={cv:null,ctx:null,lc:null,lctx:null,jc:null,jctx:null,mc:null,mctx:null,
 vw:360,vh:640,dpr:1,q:'high',lightScale:.5,fps:60};
const QUALITY={
 low:{scale:.62,part:.35,shadow:false,light:0,glow:.3,rain:70,snow:60,refl:false},
 med:{scale:.8,part:.7,shadow:false,light:.6,glow:.6,rain:140,snow:110,refl:false},
 high:{scale:1,part:1,shadow:true,light:1,glow:1,rain:240,snow:170,refl:true}
};
function Q(){return QUALITY[GFX.q]||QUALITY.high;}
function gfxInit(){
 GFX.cv=$('g');GFX.ctx=GFX.cv.getContext('2d',{alpha:false});
 GFX.lc=$('light');GFX.lctx=GFX.lc.getContext('2d');
 GFX.jc=$('joyLayer');GFX.jctx=GFX.jc.getContext('2d');
 GFX.mc=$('mini');GFX.mctx=GFX.mc.getContext('2d');
 gfxResize();
 addEventListener('resize',gfxResize,{passive:true});
 addEventListener('orientationchange',()=>setTimeout(gfxResize,260),{passive:true});
 if(visualViewport)visualViewport.addEventListener('resize',()=>setTimeout(gfxResize,140),{passive:true});
}
function gfxResize(){
 const vw=MX(320,innerWidth|0),vh=MX(320,innerHeight|0);GFX.vw=vw;GFX.vh=vh;
 const base=Q().scale*(G?G.cruiseMode?0.74:1:1);
 GFX.dpr=MN(devicePixelRatio||1,2.2)*base;
 [GFX.cv,GFX.jc].forEach(c=>{c.style.width=vw+'px';c.style.height=vh+'px';c.width=(vw*GFX.dpr)|0;c.height=(vh*GFX.dpr)|0;});
 const on=Q().light>0&&G.set.light;
 GFX.lc.style.display=on?'block':'none';
 GFX.lightScale=Q().light>.8?.5:.35;
 GFX.lc.width=(vw*GFX.lightScale)|0;GFX.lc.height=(vh*GFX.lightScale)|0;
 GFX.lc.style.width=vw+'px';GFX.lc.style.height=vh+'px';
 const ms=vw<430?104:132;$('mini').style.width=ms+'px';$('mini').style.height=ms+'px';GFX.mc.width=ms;GFX.mc.height=ms;
}
function setQuality(v){G.q=GFX.q=v;G.set.quality=v;markSave();gfxResize();}
/* auto-qualidade: derruba efeitos se o FPS do aparelho cair (Android intermediario) */
let aAcc=0,aLow=0,aHi=0;
function adaptQuality(dt){
 if(G.set.quality!=='auto')return;
 aAcc+=dt;if(aAcc<1.5)return;aAcc=0;
 const ord=['low','med','high'];
 if(GFX.fps<44){aLow++;aHi=0;}else if(GFX.fps>58){aHi++;aLow=0;}else return;
 if(aLow>=2){aLow=0;const i=ord.indexOf(GFX.q);if(i>0){GFX.q=ord[i-1];gfxResize();toast('Qualidade: '+GFX.q.toUpperCase());}}
 if(aHi>=3){aHi=0;const i=ord.indexOf(GFX.q);if(i<2){GFX.q=ord[i+1];gfxResize();}}
}

/* ========= 4. AUDIO (SFX + musica dinamica + ambiente procedural) ===== */
let AC=null,masterG=null,sfxB=null,musB=null,ambB=null,noiseBuf=null,aReady=false,aMute=false;
const mus={intensity:1,boss:false,theme:'city'},THEMES={
 city:{root:55,mode:[0,3,5,7,10]},lab:{root:49,mode:[0,2,3,7,8]},forest:{root:62,mode:[0,2,4,7,9]},
 desert:{root:57,mode:[0,2,6,7,10]},snow:{root:65,mode:[0,2,3,7,10]},volcano:{root:41,mode:[0,1,5,7,8]},
 space:{root:73,mode:[0,4,7,11,14]},boss:{root:33,mode:[0,1,4,6,7]}};
let ambNodes=null,ambKey='',mTimer=null,nextT=0,step=0;
function audioInit(){
 if(aReady)return;const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;
 try{AC=new Ctx();}catch(e){return;}
 aReady=true;
 masterG=AC.createGain();masterG.gain.value=G.set.master/100;masterG.connect(AC.destination);

function musicTick(){ /* trilha procedural: acelera e muda de cor com a acao */
 if(!aReady||aMute||G.set.music===0)return;
 const T=THEMES[mus.boss?'boss':(THEMES[mus.theme]?mus.theme:'city')];
 const bpm=88+mus.intensity*44+(mus.boss?34:0),sd=60/bpm/2;
 if(nextT<AC.currentTime+.26)nextT=AC.currentTime+.04;
 while(nextT<AC.currentTime+.26){
  const t=nextT,s=step%16,I=mus.intensity;
  if(s%4===0)tone({f:64,f2:34,d:.16,g:.2*(.6+I*.4),type:'sine',t,bus:musB});
  if(s===4||s===12)noise({f:1800,d:.09,g:.06*(.5+I*.5),t,bus:musB});
  if(s%2===0)tone({f:hz(T.root,T.mode[(step*3)%T.mode.length],0),d:.16,g:.09*(.7+I*.4),type:'sawtooth',lp:520,t,bus:musB});
  if(I>.5&&s%2===1)tone({f:hz(T.root,T.mode[(step*5)%T.mode.length],2),d:.09,g:.03*I,type:'square',lp:2600,t,bus:musB});
  if(mus.boss&&s===0)tone({f:hz(T.root,0,1),d:1.1,g:.05,type:'triangle',t,bus:musB});
  nextT+=sd;step++;
 }
}

};}

 function zone(e){
  const t=e.target;
  if(t===db||db.contains(t))return'dash';
  if(t===pb||pb.contains(t))return'pause';
  if(t===fb||fb.contains(t))return'btnfire';
  if(t===rb||rb.contains(t))return'rev';

 },op);

function axis(){

 if(In.joy.on){const dx=In.joy.x-In.joy.ox,dy=In.joy.y-In.joy.oy,d=HP(dx,dy);

const P_CAP=()=>Math.floor(420*Q().part*(G.set.particles/100));
function part(o){
 if(G.parts.length>=P_CAP())return;
 const p={x:o.x,y:o.y,vx:o.vx||0,vy:o.vy||0,life:o.life||.5,max:o.life||.5,size:o.size||3,
  col:o.col||'#fff',type:o.type||'spark',drag:o.drag==null?.9:o.drag,grav:o.grav||0,rot:o.rot||0,spin:o.spin||0,grow:o.grow||0};
 G.parts.push(p);
}
function burst(x,y,n,col,spd,size,type,life){
 n=Math.max(1,Math.round(n*Q().part));
 for(let i=0;i<n;i++){const a=rnd(TAU),s=rnd(spd||180,(spd||180)*.2);
  part({x,y,vx:COS(a)*s,vy:SIN(a)*s,life:life||rnd(.6,.25),size:size||rnd(4,1.5),col,type:type||'spark',drag:.9});}
}
function ringPulse(x,y,r,col,n){
 n=n||Math.round(14*Q().part);
 for(let i=0;i<n;i++){const a=i/n*TAU;part({x,y,vx:COS(a)*r*2,vy:SIN(a)*r*2,life:.35,size:3,col,drag:.88});}
}
function explode(x,y,r,col,dmg){
 G.shakeT=Math.max(G.shakeT,r/1200);
 sfx('boom');
 if(Q().light&&Q().glow>.3)G.lights.push({x,y,r:r*2.4,col:col||'#ff9a3c',life:.35,max:.35});
 part({x,y,size:r*.5,col:col||'#ff9a3c',type:'ring',life:.35,max:.35});
 burst(x,y,Math.round(r/6),col||'#ff9a3c',r*4,r/12,'spark',.5);
 burst(x,y,Math.round(r/14),'#3a3a3a',r*1.6,r/7,'smoke',.9);
 G.dmg.length=0;
 Grid.query(x,y,r,_q);
 for(let i=0;i<_q.length;i++){const e=_q[i];if(e&&e.kind==='enemy'&&!e.dead&&dst(x,y,e.x,e.y)<r+e.r)hurt(e,dmg||14);}
 G.texts.push&&0;
}
function dmgText(x,y,v,crit){
 if(!G.set.damage)return;
 G.texts.push({x:x+rnd(14,-14),y:y-14,vy:-46,life:.7,txt:(v>=100?fmtNum(v):Math.round(v))+(crit?'!':''),col:crit?'#ffd166':'#ffffff',size:crit?17:13});
}
function toast(t){
 const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);
 setTimeout(()=>{d.style.opacity='0';d.style.transition='opacity .3s';},1400);

}
function banner(t1,t2){
 const b=$('banner');b.children[0].textContent=t1;b.children[1].textContent=t2||'';b.style.opacity='1';
 clearTimeout(banner._t);banner._t=setTimeout(()=>b.style.opacity='0',1600);
}
function shake(v){if(G.set.shake)G.shakeT=Math.max(G.shakeT,v);}
function flash(a,dur,col){const f=$('flash');f.style.background=col||'#fff';f.style.transition='none';f.style.opacity=a;
 requestAnimationFrame(()=>{f.style.transition='opacity '+dur+'s';f.style.opacity=0;});}
function updateParts(dt){
 for(let i=G.parts.length-1;i>=0;i--){
  const p=G.parts[i];p.life-=dt;
  if(p.life<=0){G.parts.splice(i,1);continue;}
  p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.grav*dt;
  const d=Math.pow(p.drag,dt*60);p.vx*=d;p.vy*=d;p.rot+=p.spin*dt;p.size+=p.grow*dt;
 }
}

function shoot(o){
 const b={x:o.x,y:o.y,vx:o.vx,vy:o.vy,dmg:o.dmg,life:o.life||1.2,r:o.r||4,col:o.col||'#fff',kind:o.kind||'bullet',
  pierce:o.pierce||0,ric:o.ric||0,homing:o.homing||0,target:o.target||null,aoe:o.aoe||0,src:o.src||'p',
  owner:o.owner||null,hit:o.hit||null,ang:o.ang||0,spin:o.spin||0,t0:0,seg:o.seg||null,pois:o.pois||0,shock:o.shock||0,
  slow:o.slow||0,burn:o.burn||0,crit:o.crit||0,head:o.head||0,pierceLeft:o.pierce||0,ricLeft:o.ric||0,home:.3,ret:o.ret||0};
 if(!b.hit)b.hit=[];
 G.bullets.push(b);return b;
}
function nearestEnemy(x,y,max){
 let best=null,bd=max||1e9;
 for(let i=0;i<G.enemies.length;i++){const e=G.enemies[i];if(e.dead||e.hidden)continue;
  const d=dst(x,y,e.x,e.y);if(d<bd){bd=d;best=e;}}
 return best;
}
function updateBullets(dt){
 for(let i=G.bullets.length-1;i>=0;i--){
  const b=G.bullets[i];b.life-=dt;b.t0+=dt;
  if(b.kind==='boomer'){
   b.ph=(b.ph||0)+dt;
   if(b.ph>b.ret){const a=ang(b,G.p);b.vx=lerp(b.vx,COS(a)*420,dt*3);b.vy=lerp(b.vy,SIN(a)*420,dt*3);}
  }
  if(b.homing){
   if(!b.target||b.target.dead)b.target=nearestEnemy(b.x,b.y,620);
   if(b.target){const a=ang(b,b.target);b.home-=dt;
    if(b.home>0){const ca=Math.atan2(b.vy,b.vx),na=angMove(ca,a,dt*5);const s=HP(b.vx,b.vy);b.vx=COS(na)*s;b.vy=SIN(na)*s;}}
   if(chance(.4))part({x:b.x,y:b.y,vx:rnd(20,-20),vy:rnd(20,-20),life:.3,size:2.6,col:b.col,type:'smoke',drag:.94});
  }
  if(b.kind==='lob'){b.vy+=520*dt;b.vx*=Math.pow(.99,dt*60);}
  b.x+=b.vx*dt;b.y+=b.vy*dt;
  if(b.kind==='bullet'||b.kind==='missile')if(chance(dt*22))part({x:b.x,y:b.y,vx:0,vy:0,life:.16,size:b.r*.7,col:b.col,type:'trail',drag:.9});
  if(b.kind==='flame'){part({x:b.x,y:b.y,life:.3,size:b.r,col:b.col,type:'flame',drag:.9});}
  let gone=b.life<=0||Math.abs(b.x-G.p.x)>1800||Math.abs(b.y-G.p.y)>1800;
  if(!gone){
   if(b.src==='p'){
    Grid.query(b.x,b.y,b.r+30,_q);
    for(let j=0;j<_q.length;j++){
     const e=_q[j];
     if(!e||e.kind!=='enemy'||e.dead||b.hit.indexOf(e)>=0)continue;
     if(dst(b.x,b.y,e.x,e.y)>b.r+e.r)continue;
     if(e.shieldFront&&b.src==='p'){ /* escudo bloqueia pela frente */
      const a=Math.atan2(b.y-e.y,b.x-e.x),ea=ang(e,G.p);
      if(ABS(((a-ea+PI)%TAU+TAU)%TAU-PI)<e.front)b.hit.push(e);
     }
     b.hit.push(e);
     if(b.aoe){explode(b.x,b.y,b.aoe,b.col,b.dmg);}
     else hurt(e,b.dmg,b.crit,b.pois,b.shock,b.slow,b.burn);
     if(b.kind==='boomer'){b.hit.length=0;b.ph=b.ret+1;const a=ang(b,G.p);b.vx=COS(a)*460;b.vy=SIN(a)*460;shake(.05);continue;}
     if(b.pierceLeft>0){b.pierceLeft--;continue;}
     if(b.ricLeft>0){b.ricLeft--;b.hit.length=0;b.vx*=-1;b.vy*=Math.pow(-1,1);const t=nearestEnemy(b.x,b.y,420);
       if(t){const a=ang(b,t);b.vx=COS(a)*HP(b.vx,b.vy);b.vy=SIN(a)*HP(b.vx,b.vy);b.life=.9;}
       continue;}
     gone=true;break;
    }
   }else{
    const p=G.p;
    if(!p.invuln&&!p.dead&&dst(b.x,b.y,p.x,p.y)<b.r+p.r){
     hurtPlayer(b.dmg,b.col);gone=true;
    }
   }
  }
  if(b.kind==='boomer'&&gone&&b.ph<b.ret+3){ /* bumerangue que volta */
   b.life=.6;b.ph=b.ret+1;b.hit.length=0;const a=ang(b,G.p);b.vx=COS(a)*470;b.vy=SIN(a)*470;continue;
  }
  if(gone){if(b.aoe&&b.kind==='lob')explode(b.x,b.y,b.aoe,b.col,b.dmg);burst(b.x,b.y,3,b.col,60,2,'spark',.2);G.bullets.splice(i,1);}
 }
}
function drawBullets(c){
 for(let i=0;i<G.bullets.length;i++){
  const b=G.bullets[i],a=Math.atan2(b.vy,b.vx);
  if(b.kind==='beam'||b.kind==='laser'){
   const len=b.seg?b.seg.len:b.rng||300,ex=b.x+COS(b.ang)*len,ey=b.y+SIN(b.ang)*len;
   c.strokeStyle=b.col;c.lineWidth=b.r*(b.kind==='beam'?2.6:1);c.globalAlpha=clamp(b.life*3,0,1);
   c.beginPath();c.moveTo(b.x,b.y);c.lineTo(ex,ey);c.stroke();
   c.strokeStyle=rgba('#ffffff',.85);c.lineWidth=Math.max(1,b.r*.5);c.beginPath();c.moveTo(b.x,b.y);c.lineTo(ex,ey);c.stroke();
   c.globalAlpha=1;continue;
  }
  c.save();c.translate(b.x,b.y);c.rotate(a);
  if(b.kind==='boomer'){c.rotate(b.t0*14);c.strokeStyle=b.col;c.lineWidth=4;c.beginPath();c.moveTo(-9,-7);c.lineTo(9,0);c.lineTo(-9,7);c.stroke();}
  else if(b.kind==='missile'){c.fillStyle='#c9d6e8';c.fillRect(-8,-3,16,6);c.fillStyle=b.col;c.beginPath();c.moveTo(8,-3);c.lineTo(13,0);c.lineTo(8,3);c.fill();}
  else if(b.kind==='lob'){c.fillStyle=b.col;c.beginPath();c.arc(0,0,b.r,0,TAU);c.fill();c.fillStyle='#fff';c.fillRect(-1,-b.r-4,2,4);}
  else if(b.kind==='chain'){c.restore();drawChain(c,b);continue;}
  else{c.fillStyle=b.col;c.beginPath();c.ellipse(0,0,b.r*2.1,b.r*.85,0,0,TAU);c.fill();
   c.fillStyle=rgba('#ffffff',.9);c.beginPath();c.ellipse(b.r*.6,0,b.r*.9,b.r*.4,0,0,TAU);c.fill();}
  c.restore();
 }
}
function drawChain(c,b){
 if(!b.seg)return;c.strokeStyle=b.col;c.lineWidth=2.6;c.globalAlpha=clamp(b.life*4,0,1);
 c.beginPath();for(let i=0;i<b.seg.length;i++){const s=b.seg[i];i?c.lineTo(s.x,s.y):c.moveTo(s.x,s.y);
  if(i<b.seg.length-1){const n=b.seg[i+1];for(let k=1;k<4;k++){const t=k/4;c.lineTo(lerp(s.x,n.x,t)+rnd(9,-9),lerp(s.y,n.y,t)+rnd(9,-9));}}}
 c.stroke();c.globalAlpha=1;
}

/* ===================== 9. RENDER (camera + mundo) ==================== */
function render(){
 const c=GFX.ctx;if(!c)return;
 c.setTransform(GFX.dpr,0,0,GFX.dpr,0,0);
 c.fillStyle=G.map.fog;c.fillRect(0,0,GFX.vw,GFX.vh);
 /* tremor de camera */
 let sx=0,sy=0;
 if(G.shakeT>0&&G.set.shake){const m=G.shakeT*40;sx=rnd(m,-m);sy=rnd(m,-m);}
 const camX=G.cam.x-GFX.vw/2+sx, camY=G.cam.y-GFX.vh/2+sy;
 c.save();c.translate(-camX,-camY);
 drawGround(c,camX,camY);
 drawDecos(c);
 drawItems(c);
 drawParts(c,'smoke');
 drawAllies(c);
 drawEnemies(c);
 drawPlayer(c);
 drawBullets(c);
 drawParts(c,'front');
 drawWorldText(c);
 c.restore();
 drawWeatherScreen(c);
 drawLight();
 drawVignette(c);
 if(G.set.mini)drawMini();
}
function drawGround(c,x,y){
 const S=64,x0=FL(x/S)*S,y0=FL(y/S)*S;
 c.fillStyle=G.map.floor;c.fillRect(x-8,y-8,GFX.vw+16,GFX.vh+16);
 c.strokeStyle=rgba(G.map.grid,.75);c.lineWidth=1;c.beginPath();
 for(let gx=x0;gx<x+GFX.vw+S;gx+=S){c.moveTo(gx,y-8);c.lineTo(gx,y+GFX.vh+8);}
 for(let gy=y0;gy<y+GFX.vh+S;gy+=S){c.moveTo(x-8,gy);c.lineTo(x+GFX.vw+8,gy);}
 c.stroke();
 /* grade de brilho do mapa (efeito visual barato) */
 c.fillStyle=rgba(G.map.acc,.045);
 for(let gx=x0;gx<x+GFX.vw+S;gx+=S*4)for(let gy=y0;gy<y+GFX.vh+S;gy+=S*4)c.fillRect(gx,gy,2,2);
}
function drawDecos(c){
 for(let i=0;i<G.decals.length;i++){
  const d=G.decals[i];
  c.globalAlpha=.95;
  if(d.k==='bldg'){c.fillStyle='#0e1730';c.fillRect(d.x,d.y,d.w,d.h);c.fillStyle=rgba(G.map.acc,.5);
   for(let wx=d.x+6;wx<d.x+d.w-6;wx+=14)for(let wy=d.y+6;wy<d.y+d.h-6;wy+=18)if((wx+wy)%3===0)c.fillRect(wx,wy,5,7);}
  else if(d.k==='tree'){c.fillStyle='#3a2416';c.fillRect(d.x-3,d.y,6,16);c.fillStyle=d.c;c.beginPath();c.arc(d.x,d.y-6,d.r,0,TAU);c.fill();
   c.fillStyle=rgba('#000000',.25);c.beginPath();c.arc(d.x+d.r*.3,d.y-4,d.r*.7,0,TAU);c.fill();}
  else if(d.k==='rock'){c.fillStyle=d.c;c.beginPath();c.moveTo(d.x-d.r,d.y+d.r*.6);c.lineTo(d.x-d.r*.4,d.y-d.r);c.lineTo(d.x+d.r*.7,d.y-d.r*.5);c.lineTo(d.x+d.r,d.y+d.r*.6);c.closePath();c.fill();}
  else if(d.k==='cactus'){c.fillStyle='#2c6b3f';c.fillRect(d.x-5,d.y-30,10,34);c.fillRect(d.x-16,d.y-20,11,7);c.fillRect(d.x+5,d.y-26,11,7);}
  else if(d.k==='pod'){c.fillStyle='#101a2c';c.beginPath();c.arc(d.x,d.y,d.r,0,TAU);c.fill();c.fillStyle=rgba(G.map.acc,.35);c.beginPath();c.arc(d.x,d.y,d.r*.55,0,TAU);c.fill();}
  else if(d.k==='crate'){c.fillStyle='#2b1d12';c.fillRect(d.x-14,d.y-14,28,28);c.strokeStyle=rgba(G.map.acc,.5);c.strokeRect(d.x-14,d.y-14,28,28);}
  else if(d.k==='ice'){c.fillStyle=rgba('#bfefff',.5);c.beginPath();c.moveTo(d.x,d.y-d.r);c.lineTo(d.x+d.r*.6,d.y);c.lineTo(d.x,d.y+d.r*.5);c.lineTo(d.x-d.r*.6,d.y);c.closePath();c.fill();}
  else if(d.k==='lava'){c.fillStyle='#ff5a1a';c.globalAlpha=.45+.2*SIN(G.simT*3+d.x);c.beginPath();c.arc(d.x,d.y,d.r,0,TAU);c.fill();
   G.lights.push({x:d.x,y:d.y,r:d.r*3,col:'#ff5a1a',life:.05,max:.05});}
  else if(d.k==='pillar'){c.fillStyle='#243049';c.fillRect(d.x-9,d.y-40,18,44);c.fillStyle=rgba(G.map.acc,.3);c.fillRect(d.x-9,d.y-40,18,5);}
  else if(d.k==='star')continue;
  c.globalAlpha=1;
 }
 /* reflexo do chao molhado (cidade/lab com chuva) */
 if(Q().refl&&G.weather!=='clear'&&G.p){
  c.globalAlpha=.12;c.scale(1,-1);
  drawPlayerReflection(c);
  c.setTransform(GFX.dpr,0,0,GFX.dpr,0,0);
  c.translate(-(G.cam.x-GFX.vw/2),-(G.cam.y-GFX.vh/2));
  c.globalAlpha=1;
 }
}
function drawPlayerReflection(c){
 const p=G.p;c.fillStyle=p.col;c.beginPath();c.ellipse(p.x,-(p.y+ (2*(G.cam.y-GFX.vh/2)+GFX.vh))- (2*((G.cam.y+GFX.vh/2)-p.y))*0,p.r*1.4,p.r*.5,0,0,TAU);c.fill();
}
function drawParts(c,layer){
 for(let i=0;i<G.parts.length;i++){
  const p=G.parts[i],t=p.life/p.max;
  if(layer==='smoke'&&p.type!=='smoke')continue;
  if(layer==='front'&&p.type==='smoke')continue;
  if(layer==='smoke'&&p.type==='smoke'){}
  c.globalAlpha=clamp(t,0,1)*(p.type==='smoke'?.5:1);
  if(p.type==='ring'){c.strokeStyle=p.col;c.lineWidth=2+t*3;c.beginPath();c.arc(p.x,p.y,p.size*(1.6-t),0,TAU);c.stroke();}
  else if(p.type==='flame'){c.fillStyle=mixc('#ffe066',p.col,1-t);c.beginPath();c.arc(p.x,p.y,p.size*t+1,0,TAU);c.fill();}
  else if(p.type==='spark'){c.strokeStyle=p.col;c.lineWidth=Math.max(1,p.size*.5);c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x-p.vx*.02,p.y-p.vy*.02);c.stroke();}
  else{c.fillStyle=p.col;c.beginPath();c.arc(p.x,p.y,Math.max(.5,p.size*(p.type==='smoke'?1:t)),0,TAU);c.fill();}
 }
 c.globalAlpha=1;
}
function drawWorldText(c){
 c.textAlign='center';
 for(let i=0;i<G.texts.length;i++){const t=G.texts[i];c.globalAlpha=clamp(t.life*1.6,0,1);
  c.fillStyle=t.col;c.font='900 '+t.size+'px system-ui';c.fillText(t.txt,t.x,t.y);}
 c.globalAlpha=1;c.textAlign='left';
}
/* --- jogador ------------------------------------------------------- */
function drawPlayer(c){
 const p=G.p;if(!p)return;
 if(Q().shadow){c.fillStyle=rgba('#000000',.35);c.beginPath();c.ellipse(p.x,p.y+p.r*.8,p.r*1.1,p.r*.45,0,0,TAU);c.fill();}
 if(p.dashT>0){c.strokeStyle=rgba(p.col,.5);c.lineWidth=3;for(let i=1;i<4;i++){c.globalAlpha=.25/i;c.beginPath();
  c.arc(p.x-COS(p.a)*i*10,p.y-SIN(p.a)*i*10,p.r,0,TAU);c.stroke();}c.globalAlpha=1;}
 const skin=(save.skins&&save.skins[save.char])||'#00eaff';
 c.save();c.translate(p.x,p.y);c.rotate(p.a);
 if(p.shield>0){c.strokeStyle=rgba('#48e5ff',.55+.25*SIN(G.simT*7));c.lineWidth=2;c.beginPath();c.arc(0,0,p.r+7,0,TAU);c.stroke();}
 c.fillStyle=rgba(skin,.16);c.beginPath();c.arc(0,0,p.r*2.4,0,TAU);c.fill();
 c.fillStyle=skin;c.beginPath();c.arc(0,0,p.r,0,TAU);c.fill();
 c.fillStyle='#08101c';c.beginPath();c.arc(0,0,p.r*.6,0,TAU);c.fill();
 c.fillStyle=rgba('#ffffff',.85);c.beginPath();c.arc(p.r*.25,0,p.r*.28,0,TAU);c.fill();
 const w=WEAPONS[p.slots[p.slot]];
 c.fillStyle='#cfd8ea';c.fillRect(p.r*.6,-3,(w&&w.kind==='melee'?20:16),6);
 if(p.fireFlash>0){c.fillStyle=rgba(skin,.85);c.beginPath();c.arc(p.r+18,0,5+p.fireFlash*8,0,TAU);c.fill();}
 c.restore();
 if(p.iframe>0&&FL(G.simT*20)%2)c.strokeStyle=rgba('#ffffff',.5),c.beginPath(),c.arc(p.x,p.y,p.r+4,0,TAU),c.stroke();
}
/* --- inimigos / chefes (todos com desenho e animacao proprios) ------- */
function drawEnemies(c){
 for(let i=0;i<G.enemies.length;i++){
  const e=G.enemies[i];if(e.dead)continue;
  const bob=SIN(G.simT*6+e.seed)*2;
  let alpha=1;
  if(e.cloakT!==undefined)alpha=e.cloak>.5?(e.revealed?.85:.18):1;
  if(e.ghost)alpha=.55+.2*SIN(G.simT*3+e.seed);
  if(e.boss&&G.entrance){const t=G.entrance;alpha=t.t<1?0:clamp((t.t-1)*2,0,1);}
  c.globalAlpha=alpha;
  if(Q().shadow){c.fillStyle=rgba('#000000',.3);c.beginPath();c.ellipse(e.x,e.y+e.r*.8,e.r*1.1,e.r*.4,0,0,TAU);c.fill();}
  c.save();c.translate(e.x,e.y+bob);c.rotate(e.a);
  const col=e.freeze>0?'#9fe8ff':(e.burnT>0?mixc(e.c,'#ff6b1a',.5):e.c);
  drawEnemyShape(c,e,col);
  c.restore();
  c.globalAlpha=1;
  if(e.elite){c.strokeStyle=rgba('#ffd166',.8);c.lineWidth=2;c.beginPath();c.arc(e.x,e.y,e.r+6,0,TAU);c.stroke();}
  if(e.warnT>0){ /* linha de mira do francotirador */
   c.strokeStyle=rgba('#ff3b5c',.35+.3*SIN(G.simT*30));c.lineWidth=1;
   c.beginPath();c.moveTo(e.x,e.y);c.lineTo(e.x+COS(e.a)*e.range,e.y+SIN(e.a)*e.range);c.stroke();
  }
  if(!e.boss&&e.hp<e.hpMax){ /* mini barra de vida */
   const w=e.r*2;c.fillStyle=rgba('#000000',.6);c.fillRect(e.x-w/2,e.y-e.r-9,w,3.4);
   c.fillStyle=e.elite?'#ffd166':'#ff3b5c';c.fillRect(e.x-w/2,e.y-e.r-9,w*(e.hp/e.hpMax),3.4);
  }
 }
}
function drawEnemyShape(c,e,col){
 const r=e.r;
 switch(e.type){
  case 'grunt':c.fillStyle=col;c.beginPath();c.arc(0,0,r,0,TAU);c.fill();c.fillStyle='#0b1220';c.fillRect(-r*.5,-r*.3,r,r*.6);break;
  case 'runner':c.fillStyle=col;c.beginPath();c.moveTo(r,0);c.lineTo(-r*.7,-r*.8);c.lineTo(-r*.3,0);c.lineTo(-r*.7,r*.8);c.closePath();c.fill();break;
  case 'bomber':{const k=e.fuse&&e.fuse>0?(FL(G.simT*12)%2?1:.4):1;c.fillStyle=rgba('#ff7a1a',k);c.beginPath();c.arc(0,0,r,0,TAU);c.fill();
   c.strokeStyle='#ffd166';c.lineWidth=2;c.beginPath();c.arc(0,0,r*.55,0,TAU);c.stroke();c.fillStyle='#ffd166';c.beginPath();c.arc(0,-r,r*.22,0,TAU);c.fill();break;}
  case 'stalker':c.strokeStyle=col;c.lineWidth=2;c.beginPath();c.arc(0,0,r,0,TAU);c.stroke();
   c.fillStyle=rgba(col,.4);c.beginPath();c.moveTo(r,0);c.lineTo(-r,-r*.6);c.lineTo(-r,r*.6);c.closePath();c.fill();break;
  case 'medic':c.fillStyle=col;c.beginPath();c.arc(0,0,r,0,TAU);c.fill();c.fillStyle='#08130a';c.fillRect(-r*.15,-r*.6,r*.3,r*1.2);c.fillRect(-r*.6,-r*.15,r*1.2,r*.3);break;
  case 'summoner':c.fillStyle=col;c.beginPath();for(let i=0;i<6;i++){const a=i/6*TAU;i?c.lineTo(COS(a)*r,SIN(a)*r):c.moveTo(r,0);}c.closePath();c.fill();
   c.fillStyle=rgba('#ffffff',.7);c.beginPath();c.arc(0,0,r*.35+2*SIN(G.simT*5),0,TAU);c.fill();break;
  case 'sniper':c.fillStyle=col;c.fillRect(-r*.6,-r*.5,r*1.2,r);c.fillStyle='#0b1220';c.fillRect(r*.2,-r*.16,r*1.5,r*.32);break;
  case 'shielder':c.fillStyle=col;c.beginPath();c.arc(0,0,r*.8,0,TAU);c.fill();
   c.fillStyle='#cfe3ff';c.beginPath();c.arc(0,0,r,-.9,.9);c.lineTo(r*.55,0);c.closePath();c.fill();break;
  case 'ghost':c.fillStyle=rgba(col,.6);c.beginPath();c.arc(0,-r*.2,r*.9,PI,0);c.lineTo(r*.9,r*.6);
   for(let i=0;i<4;i++)c.lineTo(r*.9-i*r*.45,r*.6+(i%2?0:r*.35));c.closePath();c.fill();
   c.fillStyle='#0b1220';c.beginPath();c.arc(-r*.3,-r*.3,r*.16,0,TAU);c.arc(r*.3,-r*.3,r*.16,0,TAU);c.fill();break;
  case 'robot':c.fillStyle=col;c.fillRect(-r*.8,-r*.8,r*1.6,r*1.6);c.fillStyle='#ff3b5c';c.fillRect(-r*.5,-r*.2,r,r*.3);
   c.fillStyle='#4a5a72';c.fillRect(-r*.95,-r*.9,r*.3,r*1.8);c.fillRect(r*.65,-r*.9,r*.3,r*1.8);break;
  case 'mutant':c.fillStyle=col;c.beginPath();for(let i=0;i<9;i++){const a=i/9*TAU,rr=r*(i%2?.72:1.1);i?c.lineTo(COS(a)*rr,SIN(a)*rr):c.moveTo(rr,0);}c.closePath();c.fill();
   c.fillStyle='#0b1220';c.beginPath();c.arc(r*.2,0,r*.24,0,TAU);c.fill();break;
  case 'phantom':c.strokeStyle=col;c.lineWidth=2;c.beginPath();c.arc(0,0,r,0,TAU);c.stroke();
   c.beginPath();c.arc(0,0,r*.55,G.simT*3,G.simT*3+4);c.stroke();break;
  case 'mini':c.fillStyle=col;c.beginPath();c.arc(0,0,r,0,TAU);c.fill();c.fillStyle='#1a0f06';c.beginPath();c.arc(0,0,r*.6,0,TAU);c.fill();
   c.strokeStyle='#ffd166';c.lineWidth=4;for(let i=0;i<5;i++){const a=G.simT+i/5*TAU;c.beginPath();c.moveTo(COS(a)*r*.7,COS(a)*r*.7);c.lineTo(COS(a)*r*1.3,SIN(a)*r*1.3);c.stroke();}break;
  default: /* CHEFES: silhueta com coroa/olhos e anel de energia */
   c.fillStyle=col;c.beginPath();
   for(let i=0;i<14;i++){const a=i/14*TAU,rr=r*(i%2?.82:1.05);i?c.lineTo(COS(a)*rr,SIN(a)*rr):c.moveTo(rr,0);}
   c.closePath();c.fill();
   c.fillStyle=e.c2;c.beginPath();c.arc(r*.35,-r*.28,r*.16,0,TAU);c.arc(r*.35,r*.28,r*.16,0,TAU);c.fill();
   c.strokeStyle=rgba(e.c2,.5);c.lineWidth=3;c.beginPath();c.arc(0,0,r*1.25,G.simT*1.4,G.simT*1.4+2.4);c.stroke();
   c.beginPath();c.arc(0,0,r*1.5,-G.simT,-G.simT+1.6);c.stroke();
 }
}
/* --- itens / aliados ------------------------------------------------ */
function drawItems(c){
 for(let i=0;i<G.items.length;i++){
  const it=G.items[i],bob=SIN(G.simT*5+it.seed)*2.5;
  const col=ITEMCOL[it.k]||'#fff';
  c.fillStyle=rgba(col,.18);c.beginPath();c.arc(it.x,it.y+bob,11,0,TAU);c.fill();
  c.fillStyle=col;
  if(it.k==='xp'){c.beginPath();c.arc(it.x,it.y+bob,4,0,TAU);c.fill();}
  else if(it.k==='coin'){c.beginPath();c.ellipse(it.x,it.y+bob,4.5,6,0,0,TAU);c.fill();}
  else if(it.k==='gem'){c.beginPath();c.moveTo(it.x,it.y-6+bob);c.lineTo(it.x+5,it.y+bob);c.lineTo(it.x,it.y+6+bob);c.lineTo(it.x-5,it.y+bob);c.closePath();c.fill();}
  else if(it.k==='key'){c.fillRect(it.x-1.5,it.y-6+bob,3,12);c.beginPath();c.arc(it.x,it.y-4+bob,4,0,TAU);c.fill();}

 const cx=(G.cam.x-GFX.vw/2),cy=(G.cam.y-GFX.vh/2);

  lc.fillStyle=g;lc.beginPath();lc.arc(sx,sy,r*s,0,TAU);lc.fill();
 }

 if(G.p.fireFlash>0)hole(G.p.x+COS(G.p.a)*40,G.p.y+SIN(G.p.a)*40,150,.7);

/* ==================== 10. PLAYER (stats / acao) ====================== */
function computeStats(){
 const ch=CHARS.find(c=>c.id===save.char)||CHARS[0];
 const lv=save.level, tr=save.tree||{};
 const t=k=>tr[k]||0;
 const u=id=>save.up[id]||0;
 const m=G.mods||{};
 const s={};
 s.hpMax=Math.round(ch.hp*(1+u('hp')*UPGRADES[1].per)*(1+t('t_hp')*.08*(lv-1))* (m.hpMul||1));
 s.shieldMax=Math.round(u('shield')*20+t('t_sh')*6*(lv-1));
 s.spd=ch.spd*(1+u('speed')*.08)*(1+t('t_spd')*.03*(lv-1))*(m.speedMul||1);
 s.dmgMul=ch.dmg*(1+u('dmg')*.15)*(1+t('t_dmg')*.05*(lv-1))*(m.dmgMul||1);
 s.crit=ch.crit+u('crit')*.08+t('t_crit')*.02*(lv-1)+(m.critBonus||0);
 s.vamp=u('vamp')*.03;
 s.poison=u('poison')*4; s.burn=u('burn')*4;
 s.freeze=ch.id==='zero'?u('freeze')*.08+.1:u('freeze')*.08;
 s.shock=u('shock')*.08;
 s.blast=u('blast')*10;
 s.ricochet=u('ricochet'); s.pierce=u('pierce');
 s.magnet=90+u('magnet')*40;
 s.regen=(u('regen')*1.4+(ch.id==='doc'?2:0)+t('t_regen')*.3*(lv-1))*(m.noRegen?0:1);
 s.dashCd=(ch.id==='vega'?.9:1.35)*(1-u('dash')*.12)*(1-t('t_dash')*.04*(lv-1));
 s.multishot=u('multishot');
 s.pets=u('pet');
 s.revive=u('revive')+(t('t_revive')||0);
 s.goldMul=(1+t('gold',0)+t('t_gold')*.06*(lv-1))*(m.coinMul||1)*(1+((tr.t_gold||0)*0));
 s.goldMul=1+t('t_gold')*.06*(lv-1)+(m.coinMul||1)-1;
 s.xpMul=(1+t('t_xp')*.05*(lv-1));
 s.luck=1+t('t_luck')*.08;
 s.reviveChance=.5+t('t_revive')*.05;
 s.meleeOnly=m.meleeOnly||0;
 return s;
}
function initPlayer(){
 const s=computeStats();
 G.p={x:G.worldSize/2,y:G.worldSize/2,vx:0,vy:0,a:-PI/2,r:14,col:skinColor(),
  hp:s.hpMax,hpMax:s.hpMax,shield:s.shieldMax,shieldMax:s.shieldMax,
  iframe:0,invuln:0,dashT:0,dashCd:.6,dashCdMax:s.dashCd,
  slots:[],slot:0,fireT:0,fireFlash:0,muzzle:0,dead:false,
  stun:0,regenAcc:0,stats:s,trail:[],aimX:0,aimY:0,moving:false};
 /* slots iniciais: pistola + armas escolhidas no menu de armas */
 G.p.slots=[{id:'pistol',lvl:save.weapons.pistol||1}];
 (G.loadout||[]).forEach(id=>{if(G.p.slots.length<5)G.p.slots.push({id:save.weapons[id]?id:id,lvl:save.weapons[id]||1});});
 G.p.slots.forEach(s2=>{s2.lvl=(save.weapons[s2.id]||1)+((save.tree.t_start)||0);});
 applySlot();
}
function skinColor(){const sk=SKINS.find(s=>s.id===(save.skins&&save.skins[save.char]))||SKINS[0];return sk.c;}
function applySlot(){
 const w=G.p.slots[G.p.slot];if(!w)return;
 const d=WEAPONS[w.id];G.playerWeapon=d;
 const ev=w.lvl>=3?d.ev[1]:(w.lvl>=2?d.ev[0]:null);
 G.wstats={dmg:d.dmg*(ev&&ev.dmg||1),rate:d.rate*(ev&&ev.rate||1),rng:(d.rng||300)*(ev&&ev.rng||1),
  vel:d.vel||600,pierce:(d.pierce||0)+(ev&&ev.pierce||0)+(G.player?G.player.stats.pierce:0),
  ric:(d.ric||0)+(ev&&ev.ric||0)+G.player.stats.ricochet,aoe:(d.aoe||0)*(ev&&ev.aoe||1)+G.player.stats.blast,
  pellets:(d.pellets||1),spread:d.spread||0,homing:d.homing||0,chain:(d.chain||0)+(ev&&ev.chain||0),
  count:(ev&&ev.count||1)+(G.player.stats.multishot||0),beams:(d.beams||0)+(ev&&ev.beams||0),
  arc:d.arc||1.5,col:d.col,kind:d.kind,lifesteal:(d.lifesteal||0)+(ev&&ev.lifesteal||0),
  summon:(d.summon||0)+(ev&&ev.summon||0),sumType:d.sum||'drone',head:d.head||0,burn:d.burn||0,shock:d.shock||0};
 if(G.wstats.kind==='summon')ensureAllies();
}
function selectSlot(i){if(G.p&&G.p.slots[i]){G.p.slot=i;applySlot();sfx('ui');toast(WEAPONS[G.p.slots[i].id].name);}}
function updatePlayer(dt){
 const p=G.p;if(!p)return;
 const s=p.stats;
 p.hpMax=s.hpMax; p.shieldMax=s.shieldMax;
 p.iframe=Math.max(0,p.iframe-dt); p.invuln=Math.max(0,p.invuln-dt);
 p.dashCd=Math.max(0,p.dashCd-dt); p.fireT=Math.max(0,p.fireT-dt); p.fireFlash=Math.max(0,p.fireFlash-dt*6);
 p.stun=Math.max(0,p.stun-dt);
 if(G.mods.noRegen===undefined){p.regenAcc+=s.regen*dt;if(p.regenAcc>=1){const h=FL(p.regenAcc);p.regenAcc-=h;healPlayer(h);}}
 const ax=axis();
 if(p.dashT>0){p.dashT-=dt;if(chance(.6))part({x:p.x,y:p.y,life:.3,size:p.r,col:p.col,type:'spark',drag:.85});}
 else if(!p.stun){
  p.vx=lerp(p.vx,ax.x*s.spd,dt*12);p.vy=lerp(p.vy,ax.y*s.spd,dt*12);
 }else{p.vx*=Math.pow(.2,dt);p.vy*=Math.pow(.2,dt);}
 if(In.dashReq){In.dashReq=false;doDash(ax);}
 p.x=clamp(p.x+p.vx*dt,20,G.worldSize-20);p.y=clamp(p.y+p.vy*dt,20,G.worldSize-20);
 save.stats.distance+=HP(p.vx,p.vy)*dt/64;
 p.moving=HP(p.vx,p.vy)>18;
 if(p.moving&&chance(dt*10))part({x:p.x,y:p.y+p.r*.6,life:.25,size:3,col:p.col,type:'spark',drag:.9});
 /* mira: direcional do segundo toque > auto-mira > direcao de movimento */
 if(In.aim.on&&In.aim.id>=0){
  const wx=In.aim.x+G.cam.x-GFX.vw/2,wy=In.aim.y+G.cam.y-GFX.vh/2;
  p.a=angMove(p.a,angleTo(p.x,p.y,wx,wy),dt*18);p.aimX=wx;p.aimY=wy;
 }else{
  const tg=G.set.autoaim?nearestEnemy(p.x,p.y,G.wstats?G.wstats.rng+200:600):null;
  if(tg)p.a=angMove(p.a,ang(p,tg),dt*10);
  else if(ax.x||ax.y)p.a=angMove(p.a,AT2(ax.y,ax.x),dt*14);
 }
 if(firing())tryFire(dt);
 if(p.hp<=0&&!p.dead)playerDown();
}
function angleTo(x1,y1,x2,y2){return AT2(y2-y1,x2-x1);}
function doDash(ax){
 const p=G.p;if(p.dashCd>0||(G.mods.noDash))return;
 let dx=ax.x,dy=ax.y;if(!dx&&!dy){dx=COS(p.a);dy=SIN(p.a);}
 const l=HP(dx,dy)||1;p.vx=dx/l*1150;p.vy=dy/l*1150;p.dashT=.16;p.dashCd=p.stats.dashCdMax;
 p.iframe=Math.max(p.iframe,.28);sfx('dash');vibrate(10);shake(.06);
 ringPulse(p.x,p.y,34,p.col,10);save.stats.dash++;
}
function tryFire(dt){
 const p=G.p,ws=G.wstats;if(!ws)return;
 if(p.fireT>0)return;
 if(ws.meleeOnly&&ws.kind!=='melee')return;
 p.fireT=ws.rate;
 if(ws.kind==='summon'){ensureAllies();sfx('deploy');p.fireT=1.4;return;}
 sfx(WEAPONS[p.slots[p.slot]]&&WEAPONS[p.slots[p.slot]].id?WEAPONS[p.slots[p.slot]].id in WEAPONS?(WEAPONS[p.slots[p.slot]].id==='smg'?'smg':WEAPONS[p.slots[p.slot]].snd):'pistol':ws.snd||'pistol');
 p.fireFlash=1;
 const mx=p.x+COS(p.a)*(p.r+14),my=p.y+SIN(p.a)*(p.r+14);
 G.lights.push({x:mx,y:my,r:130,col:ws.col,life:.09,max:.09});
 const dmgBase=ws.dmg*p.stats.dmgMul;
 if(ws.kind==='melee'){meleeSwing(ws,dmgBase);return;}
 if(ws.kind==='chain'){chainBolt(ws,dmgBase,mx,my);return;}
 if(ws.kind==='laser'){laserShot(ws,dmgBase,mx,my);return;}
 if(ws.kind==='flame'){for(let i=0;i<3;i++)shootFlame(ws,dmgBase,mx,my,i);return;}
 const shots=ws.count;
 for(let s2=0;s2<shots;s2++){
  const off=(s2-(shots-1)/2)*.14+ (ws.spread?rnd(ws.spread,-ws.spread):0);
  const a=p.a+off;
  const crit=chance(p.stats.crit);
  const dmg=dmgBase*(crit?2:1)*(ws.pellets?1:1);
  const pellets=ws.pellets||1;
  for(let k=0;k<pellets;k++){
   const pa=a+(pellets>1?rnd(ws.spread,-ws.spread)*.6:0);
   shoot({x:mx,y:my,vx:COS(pa)*ws.vel,vy:SIN(pa)*ws.vel,dmg:pellets>1?dmgBase*(crit?2:1):dmg,
    r:2+(ws.aoe?2:1),col:ws.col,life:ws.rng/ws.vel,pierce:ws.pierce,ric:ws.ric,aoe:ws.aoe,
    homing:ws.homing,homing0:ws.homing,crit:crit?1:0,pois:p.stats.poison,shock:ws.shock||p.stats.shock>.5?1:0,
    burn:ws.burn?p.stats.burn:0,slow:0,head:ws.head});
  }
 }
 save.stats.shots+=Math.max(1,shots*(ws.pellets||1));
 shake(ws.kind==='bullet'?.02:.03);
 vibrate(4);
}
function meleeSwing(ws,dmg){
 const p=G.p;
 const arc=ws.arc>=6?TAU:ws.arc;
 const n=Math.max(1,ws.count||1);
 sfx(ws.col==='#eaf6ff'?'sword':'melee');
 for(let i=0;i<n;i++){
  const a=p.a+(n>1?(i-(n-1)/2)*.9:0);
  G.arcSwings.push({x:p.x,y:p.y,a,r:ws.rng+p.r,arc,life:.18,max:.18,col:ws.col});
  Grid.query(p.x,p.y,ws.rng+p.r+30,_q);
  for(let j=0;j<_q.length;j++){const e=_q[j];if(!e||e.kind!=='enemy'||e.dead)continue;
   const d=dst(p.x,p.y,e.x,e.y);if(d>ws.rng+e.r+p.r)continue;
   const da=((ang(e,p)-a+PI)%TAU+TAU)%TAU-PI;
   if(ABS(da)<arc/2)hurt(e,dmg*(1+save.up.dmg*.0),0,p.stats.poison,p.stats.shock>.5?1:0,0,0);
  }
  if(ws.aoe)explode(p.x+COS(a)*ws.rng*.7,p.y+SIN(a)*ws.rng*.7,ws.aoe,ws.col,dmg*.6);
 }
 shake(.05);
}
function chainBolt(ws,dmg,mx,my){
 const p=G.p;let from={x:mx,y:my},used=[],pts=[{x:mx,y:my}];
 let node=nearestEnemy(mx,my,ws.rng);
 for(let i=0;i<ws.chain&&node;i++){
  if(used.indexOf(node)>=0)break;
  used.push(node);pts.push({x:node.x,y:node.y});
  hurt(node,dmg*(1-i*.08),0,p.stats.poison,1,0,0);
  node=nearestEnemy(node.x,node.y,ws.rng*.6);
  while(node&&used.indexOf(node)>=0)node=null;
 }
 sfx('tesla');
 const b=shoot({x:mx,y:my,vx:0,vy:0,dmg:0,life:.12,r:3,col:ws.col,kind:'chain',seg:pts});
 if(ws.aoe&&pts.length>1)explode(pts[pts.length-1].x,pts[pts.length-1].y,ws.aoe,ws.col,dmg*.5);
}
function laserShot(ws,dmg,mx,my){
 const p=G.p,n=Math.max(1,ws.beams||ws.count||1);
 sfx('laser');
 for(let i=0;i<n;i++){
  const a=p.a+(i-(n-1)/2)*.16;
  shoot({x:mx,y:my,vx:0,vy:0,dmg:0,life:.14,r:3.4,col:ws.col,kind:'beam',ang:a,rng:ws.rng,seg:{}});
  /* dano ao longo do feixe */
  const step=14;
  for(let d=step;d<ws.rng;d+=step){
   const px=mx+COS(a)*d,py=my+SIN(a)*d;
   Grid.query(px,py,16,_q);
   for(let j=0;j<_q.length;j++){const e=_q[j];if(e&&e.kind==='enemy'&&!e.dead&&dst(px,py,e.x,e.y)<e.r+6){
     hurt(e,dmg,0,p.stats.poison,0,0,ws.burn?p.stats.burn:0);d=ws.rng;break;}}
  }
 }
}
function shootFlame(ws,dmg,mx,my,i){
 const p=G.p,a=p.a+rnd(.28,-.28);
 shoot({x:mx,y:my,vx:COS(a)*ws.vel*rnd(1.1,.8),vy:SIN(a)*ws.vel*rnd(1.1,.8),dmg:dmg*.55,
  r:6,col:ws.col,kind:'flame',life:ws.rng/ws.vel,burn:1,pois:p.stats.poison*.5,aoe:0});
 if(i===0)sfx('flame');
}
function ensureAllies(){
 const p=G.p,ws=G.wstats;
 const want=ws.kind==='summon'?ws.summon:0;
 if(ws.kind==='summon'){
  G.allies.length=0;
  for(let i=0;i<want;i++)G.allies.push({kind:ws.sumType,x:p.x+rnd(60,-60),y:p.y+rnd(60,-60),
   a:0,fireT:rnd(.5),rng:ws.rng,dmg:ws.dmg*p.stats.dmgMul,rate:WEAPONS[p.slots[p.slot]].rate,i,col:ws.col});
 }
 if(p.stats.pets>0&&G.allies.filter(a=>a.kind==='pet').length===0)
  for(let i=0;i<p.stats.pets;i++)G.allies.push({kind:'pet',x:p.x,y:p.y,a:0,fireT:0,rng:340,dmg:8*p.stats.dmgMul,rate:.6,i,col:'#ff8ad6'});
}
function healPlayer(v){const p=G.p;if(!p||p.dead)return;const before=p.hp;
 if(p.shield<p.shieldMax){const add=Math.min(p.shieldMax-p.shield,v);p.shield+=add;v-=add;}
 p.hp=Math.min(p.hpMax,p.hp+v);

}
function hurtPlayer(v,col){
 const p=G.p;if(!p||p.dead||p.iframe>0||p.invuln>0)return;

 if(p.hp<=0)playerDown();
}
function playerDown(){

 if(p.stats.revive&&!G.revUsed){$('revBtn').classList.remove('hidden');p.dead=true;G.revTimer=2.2;return;}

 G.revUsed=true;p.dead=false;p.hp=p.hpMax*.55;p.invuln=4;

function spawnEnemy(type,opt){
 const d=ENEMIES[type];if(!d)return;
 opt=opt||{};
 const diff=G.diff||1;
 const x=opt.x!==undefined?opt.x:clamp(G.p.x+rnd(1100,-1100),40,G.worldSize-40);
 const y=opt.y!==undefined?opt.y:clamp(G.p.y+rnd(1100,-1100),40,G.worldSize-40);
 const e={kind:'enemy',type:type,x:x,y:y,vx:0,vy:0,a:0,r:d.r,c:d.c,c2:d.c2||'#fff',
  hp:d.hp*diff*(opt.elite?2.6:1),hpMax:1,spd:d.spd*(1+(diff-1)*.1)*(opt.elite?.9:1),
  dmg:d.dmg*(1+(diff-1)*.15),xp:d.xp*(opt.elite?3:1),ai:d.ai,atk:d.atk,dead:false,
  seed:rnd(TAU),hitT:0,atkT:rnd(1.4),regen:d.regen||0,heal:d.heal||0,aura:d.aura||0,cap:d.cap||0,
  period:d.period||2,spawns:d.spawns,bSpd:d.bSpd||420,range:d.range||420,warn:d.warn||0,warnT:0,burst:d.burst||1,
  front:d.front||0,reduce:d.reduce||0,cloak:d.cloak?1:0,ghost:d.ghost?1:0,mini:d.mini?1:0,elite:!!opt.elite,
  boss:!!opt.boss,bossKey:opt.bossKey||null,phase:1,bossState:'fight',atkIdx:0,atkTmr:1.6,moved:0,freeze:0,burnT:0,burnDps:0,
  poison:0,poisonDps:0,shockT:0,slowT:0,hidden:false,revealed:0,fuse:0,leapT:0,leapX:0,leapY:0,phaseT:0};
 e.hpMax=e.hp;
 G.enemies.push(e);
 if(e.boss){G.boss=e;}
 return e;
}
function spawnWave(n){
 const pool=G.map.enemies;
 for(let i=0;i<n;i++){
  let t=pick(pool);
  if(G.wave>3&&chance(.18))t='mini'===t?t:pick(['shielder','mutant','sniper','medic']);
  spawnEnemy(t,{elite:chance(.04+(G.mods.eliteMul||1)*.02*G.wave)});
 }
}
function updateEnemies(dt){
 Grid.clear();
 for(let i=0;i<G.enemies.length;i++)if(!G.enemies[i].dead)Grid.insert(G.enemies[i]);
 for(let i=G.enemies.length-1;i>=0;i--){
  const e=G.enemies[i];
  if(e.dead){G.enemies.splice(i,1);if(G.boss===e)G.boss=null;continue;}
  if(e.hitT>0)e.hitT-=dt;
  if(e.freeze>0){e.freeze-=dt;}
  if(e.poison>0){e.poison-=dt;hurt(e,e.poisonDps*dt,true);}
  if(e.burnT>0){e.burnT-=dt;hurt(e,e.burnDps*dt,true);if(chance(dt*8))part({x:e.x,y:e.y,life:.3,size:3,col:'#ff8a2b',type:'flame'});}
  if(e.slowT>0)e.slowT-=dt;
  if(e.shockT>0){e.shockT-=dt;if(chance(dt*10))part({x:e.x,y:e.y,life:.2,size:2.5,col:'#8ef1ff',type:'spark'});}
  if(e.regen)e.hp=Math.min(e.hpMax,e.hp+e.regen*dt);
  if(e.dead)continue;
  const speedMul=(e.freeze>0?.35:1)*(e.slowT>0?.45:1)*(e.shockT>0?.7:1);
  if(e.boss){updateBoss(e,dt);continue;}
  e.a=angMove(e.a,ang(e,G.p),dt*6);
  const d=dist(e,G.p);
  switch(e.ai){
   case 'rush':
    e.vx=COS(e.a)*e.spd*speedMul;e.vy=SIN(e.a)*e.spd*speedMul;break;
   case 'sniper':
    if(d<e.range*.65){e.vx=-COS(e.a)*e.spd*.8*speedMul;e.vy=-SIN(e.a)*e.spd*.8*speedMul;}
    else if(d>e.range){e.vx=COS(e.a)*e.spd*speedMul;e.vy=SIN(e.a)*e.spd*speedMul;}
    else{e.vx*=.9;e.vy*=.9;e.a=angMove(e.a,ang(e,G.p),dt*4);}
    e.atkT-=dt;
    if(e.atkT<=0&&d<e.range){e.warnT=e.warn;e.atkT=e.period+rnd(.6);}
    if(e.warnT>0){e.warnT-=dt;e.a=angMove(e.a,ang(e,G.p),dt*3);
     if(e.warnT<=0){shoot({x:e.x+COS(e.a)*e.r,y:e.y+SIN(e.a)*e.r,vx:COS(e.a)*e.bSpd,vy:SIN(e.a)*e.bSpd,
      dmg:e.dmg,r:5,col:'#ffe066',life:2,src:'e'});sfx('sniper');}}
    break;
   case 'shield':e.vx=COS(e.a)*e.spd*speedMul;e.vy=SIN(e.a)*e.spd*speedMul;break;
   case 'healer':{
    let t=null;
    for(let k=0;k<G.enemies.length;k++){const o=G.enemies[k];if(o===e||o.dead||o.hp>=o.hpMax)continue;
     if(dst(e.x,e.y,o.x,o.y)<e.aura){t=o;break;}}
    if(t&&d>150){e.vx=COS(e.a)*e.spd*.8*speedMul;e.vy=SIN(e.a)*e.spd*.8*speedMul;}
    else if(d<170){e.vx=-COS(e.a)*e.spd*.7*speedMul;e.vy=-SIN(e.a)*e.spd*.7*speedMul;}
    else{e.vx*=.92;e.vy*=.92;}
    e.atkT-=dt;if(e.atkT<=0){e.atkT=1.4;
     for(let k=0;k<G.enemies.length;k++){const o=G.enemies[k];if(o.dead)continue;
      if(dst(e.x,e.y,o.x,o.y)<e.aura){o.hp=Math.min(o.hpMax,o.hp+e.heal);
       part({x:o.x,y:o.y,life:.4,size:4,col:'#7cff4f',type:'spark',vy:-40});}}
     if(chance(.5))sfx('heal');}
    break;}
   case 'summoner':{
    if(d<200){e.vx=-COS(e.a)*e.spd*.7*speedMul;e.vy=-SIN(e.a)*e.spd*.7*speedMul;}
    else{e.vx=COS(e.a)*e.spd*.8*speedMul;e.vy=SIN(e.a)*e.spd*.8*speedMul;}
    e.atkT-=dt;
    const alive=G.enemies.filter(o=>o.summoned&&!o.dead).length;
    if(e.atkT<=0&&alive<e.cap&&G.enemies.length<70){e.atkT=e.period;
     for(let k=0;k<2;k++){const s=spawnEnemy(e.spawns,{x:e.x+rnd(50,-50),y:e.y+rnd(50,-50)});if(s)s.summoned=1;}
     ringPulse(e.x,e.y,40,'#b06bff',8);sfx('alarm');}
    break;}
   case 'flinch': /* invisivel: so aparece perto */
    e.hidden=e.cloak&&d>150;e.revealed=!e.hidden;
    e.vx=COS(e.a)*e.spd*speedMul*(e.hidden?1.15:.9);e.vy=SIN(e.a)*e.spd*speedMul*(e.hidden?1.15:.9);break;
   case 'orbiter':{
    const target=200;const err=d-target;
    const perp=e.a+PI/2;
    e.vx=(COS(e.a)*err*.9+COS(perp)*e.spd*.8)*speedMul;
    e.vy=(SIN(e.a)*err*.9+SIN(perp)*e.spd*.8)*speedMul;
    e.atkT-=dt;if(e.atkT<=0&&d<420){e.atkT=e.period;
     for(let k=0;k<3;k++){const a=ang(e,G.p)+rnd(.3,-.3);
      shoot({x:e.x,y:e.y,vx:COS(a)*420,vy:SIN(a)*420,dmg:e.dmg*.7,r:5,col:e.c,life:1.6,src:'e'});}
     sfx('laser');}
    break;}
   default: /* chase */
    e.vx=COS(e.a)*e.spd*speedMul;e.vy=SIN(e.a)*e.spd*speedMul;
  }
  /* ataques de contato / explosao / tiros */
  if(e.atk==='bomb'){
   if(d<e.r+G.p.r+26){e.fuse=(e.fuse||0)+dt;
    if(e.fuse>.5){explode(e.x,e.y,e.boom||118,e.c,e.dmg);killEnemy(e,false);continue;}}
   else e.fuse=Math.max(0,(e.fuse||0)-dt);
  }else if(e.atk==='bullet'&&e.atkT!==undefined){
   e.atkT-=dt;
   if(e.atkT<=0&&d<e.range){e.atkT=e.period;
    const n=e.burst||1;
    for(let k=0;k<n;k++){const a=ang(e,G.p)+(k-(n-1)/2)*.18;
     shoot({x:e.x,y:e.y,vx:COS(a)*e.bSpd,vy:SIN(a)*e.bSpd,dmg:e.dmg*.8,r:5,col:e.c,life:2.2,src:'e'});}
    sfx('smg');}
  }else if(e.atk==='melee'||e.atk==='slash'||e.atk==='touch'){
   if(d<e.r+G.p.r+(e.atk==='melee'?16:4))hurtPlayer(e.dmg*(e.atk==='melee'?1.2:1),e.c);
  }
  /* separacao barata (sem O(n^2) total) */
  Grid.query(e.x,e.y,e.r+22,_q);
  for(let k=0;k<_q.length;k++){const o=_q[k];if(o===e||o.dead||o.kind!=='enemy')continue;
   const dd=dst(e.x,e.y,o.x,o.y),mn=e.r+o.r;
   if(dd<mn&&dd>0){const push=(mn-dd)*.5;const a=Math.atan2(e.y-o.y,e.x-o.x);
    e.x+=COS(a)*push*.5;e.y+=SIN(a)*push*.5;o.x-=COS(a)*push*.5;o.y-=SIN(a)*push*.5;}}
  if(e.mini&&chance(dt*2))part({x:e.x,y:e.y,life:.4,size:5,col:e.c,type:'spark',drag:.9});
 }
}
function hurt(e,v,silent,pois,shock,slow,burn){
 if(!e||e.dead)return;
 if(e.reduce&&e.front&&e.shieldAngle){}
 const crit=false;
 e.hp-=v;e.hitT=.08;
 if(!silent)dmgText(e.x,e.y,v,crit);
 if(pois&&e.poison<=0){e.poison=3;e.poisonDps=pois;}
 if(shock){e.shockT=.6;}
 if(slow)e.slowT=1.2;
 if(burn){e.burnT=2.5;e.burnDps=burn;}
 if(e.freeze!==undefined&&G.player&&chance(.0)){ }
 if(e.hp<=0)killEnemy(e,!silent);
}
function killEnemy(e,showFx){
 if(e.dead)return;
 e.dead=true;G.kills++;save.stats.kills++;
 G.earned.kills++;
 const p=G.p;
 if(p.stats.vamp)healPlayer(p.stats.vamp*Math.max(4,e.dmg));
 const m=G.map;
 if(!e.boss){
  dropLoot(e.x,e.y,e);
  if(chance(.12))spawnItem('coin',e.x+rnd(12,-12),e.y+rnd(12,-12));
 }
 if(showFx!==false){
  burst(e.x,e.y,e.boss?90:12,e.c,e.boss?520:220,e.boss?7:3.5,'spark',.5);
  burst(e.x,e.y,e.boss?26:5,'#2b3548',120,e.boss?10:4,'smoke',.8);
  if(e.boss)bossDeath(e);else ringPulse(e.x,e.y,e.r*1.6,e.c,8);
 }
 sfx(e.boss?'win':'ui');
 if(e.boss)G.boss=null;
 if(G.mode==='campaign'||G.mode==='endless'||G.mode==='survival')G.waveKilled++;
}
/* ---------------- CHEFES: entrada, fases, ataques ------------------- */
function spawnBoss(key,opt){
 const b=BOSSES[key];if(!b)return;
 const e=spawnEnemy('boss',{x:G.p.x+420,y:G.p.y-260,boss:true,bossKey:key});
 if(!e)return;
 Object.assign(e,{n:b.n,r:b.r,c:b.c,c2:b.c2,hp:b.hp*(G.diff||1),hpMax:b.hp*(G.diff||1),
  xp:b.xp,coin:b.coin,gem:b.gem,phases:b.phases,atks:b.atks,bossKey:key,name:b.n});
 G.entrance={t:0,b:b,e:e};
 e.hiddenEntrance=true;
 mus.boss=true;mus.intensity=1.4;
 sfx('boss');shake(.5);
 $('bossBar').classList.remove('hidden');
 $('bossBar').querySelector('.nm').textContent=b.n;
 return e;
}
function updateEntrance(dt){
 if(!G.entrance)return;
 const E=G.entrance;E.t+=dt;
 if(E.t<.6)shake(.35);
 if(E.t>1.2){G.entrance=null;E.e.hiddenEntrance=false;E.e.bossState='fight';}
 else{E.e.x=lerp(E.e.x,G.p.x+330,dt*1.2);E.e.y=lerp(E.e.y,G.p.y-120,dt*1.2);E.e.hiddenEntrance=E.t<1;}
}
function updateBoss(e,dt){
 if(e.hiddenEntrance)return;
 if(G.entrance)return;
 const b=BOSSES[e.bossKey];
 /* transicao de fase */
 const frac=e.hp/e.hpMax;
 let ph=1;for(let i=0;i<e.phases.length;i++)if(frac<=e.phases[i])ph=i+1;
 if(ph!==e.phase){
  e.phase=ph;banner('FASE '+ph,e.name);shake(.4);flash(.35,.5,e.c2);sfx('alarm');
  explode(e.x,e.y,220,e.c2,0);e.atkTmr=.8;
 }
 const d=dist(e,G.p);
 e.a=angMove(e.a,ang(e,G.p),dt*(1.5+e.phase*.5));
 /* movimento por arquetipo */
 const want=e.bossKey==='wizard'||e.bossKey==='shadow'?300:190;
 const err=d-want;
 e.vx=COS(e.a)*err*1.5*e.phase*.4;e.vy=SIN(e.a)*err*1.5*e.phase*.4;
 if(e.leapT>0){e.leapT-=dt;e.vx=COS(Math.atan2(e.leapY-e.y,e.leapX-e.x))*700;e.vy=SIN(Math.atan2(e.leapY-e.y,e.leapX-e.x))*700;
  if(e.leapT<=0){explode(e.x,e.y,150,e.c2,18);shake(.3);}}
 e.x+=e.vx*dt;e.y+=e.vy*dt;
 /* ataque */
 e.atkTmr-=dt;
 if(e.atkTmr<=0){
  const list=b.atks.filter(a=>true);
  const tot=list.reduce((s,a)=>s+a[1],0);
  let r=rnd(tot),chosen=list[0][0];
  for(let i=0;i<list.length;i++){r-=list[i][1];if(r<=0){chosen=list[i][0];break;}}
  /* fase alta: mais ataques por chamada */
  bossAttack(e,chosen);
  if(e.phase>=3&&chance(.5))bossAttack(e,pick(['burst','ring','meteor','spiral']));
  e.atkTmr=MX(.9,2.4-e.phase*.45)*rnd(1.15,.85);
 }
 if(chance(dt*10))part({x:e.x+rnd(e.r,-e.r),y:e.y+rnd(e.r,-e.r),life:.5,size:4,col:e.c2,type:'spark',drag:.9});
}
function bossAttack(e,k){
 const p=G.p,a=ang(e,p);
 const S=e.phase;
 const D=(base)=>base*(1+S*.25);
 switch(k){
  case 'breath': /* cone de fogo */
   G.lights.push({x:e.x,y:e.y,r:420,col:'#ff8a2b',life:.4,max:.4});
   for(let i=0;i<26+S*8;i++){const aa=a+rnd(.42,-.42);
    shoot({x:e.x,y:e.y,vx:COS(aa)*rnd(700,320),vy:SIN(aa)*rnd(700,320),dmg:D(9),r:9,col:'#ff8a2b',kind:'flame',life:.75,burn:1,src:'e'});}
   sfx('flame');break;
  case 'meteor': /* marcadores que caem e explodem */
   for(let i=0;i<4+S*2;i++){const tx=p.x+rnd(340,-340),ty=p.y+rnd(340,-340);
    G.markers.push({x:tx,y:ty,t:.9,life:.9,r:70+S*8,col:'#ff5a3c'});}
   sfx('alarm');break;
  case 'sweep': /* feixe rotativo */
   G.beams.push({x:e.x,y:e.y,a:a-.9,spin:1.6+ (S-1)*.6,life:2.4+S*.4,dmg:11,len:900,col:e.c2,w:16+6*S});
   sfx('laser');break;
  case 'dive': case 'leap': e.leapT=.4;e.leapX=p.x;e.leapY=p.y;break;
  case 'missile':
   for(let i=0;i<3+S;i++){const aa=a+rnd(.7,-.7);
    shoot({x:e.x,y:e.y,vx:COS(aa)*300,vy:SIN(aa)*300,dmg:D(14),r:6,col:'#ff5c7a',kind:'missile',homing:4,aoe:70,life:3,src:'e'});}
   sfx('missile');break;
  case 'stomp':
   for(let i=0;i<3;i++)setTimeout(()=>{if(G.screen==='play'){explode(e.x,e.y,140+i*60,e.c2,D(12));ringPulse(e.x,e.y,150+i*60,e.c2,20);}},i*260);
   break;
  case 'slam': e.leapT=.45;e.leapX=p.x;e.leapY=p.y;
   setTimeout(()=>{if(G.screen==='play')explode(e.x,e.y,240,e.c2,D(22));},470);break;
  case 'web':
   for(let i=0;i<5;i++){const aa=a+rnd(.5,-.5);
    shoot({x:e.x,y:e.y,vx:COS(aa)*420,vy:SIN(aa)*420,dmg:D(8),r:8,col:'#c3a1ff',life:1.6,slow:1,src:'e'});}
   sfx('melee');break;
  case 'summon':
   for(let i=0;i<2+S;i++){const s=spawnEnemy(BOSSES[e.bossKey]&&G.map.enemies[i%G.map.enemies.length]||'grunt',
     {x:e.x+rnd(90,-90),y:e.y+rnd(90,-90)});if(s)s.summoned=1;}
   ringPulse(e.x,e.y,80,e.c2,14);sfx('alarm');break;
  case 'burst': case 'ring':
   for(let i=0;i<12+S*5;i++){const aa=i/(12+S*5)*TAU+G.simT;
    shoot({x:e.x,y:e.y,vx:COS(aa)*460,vy:SIN(aa)*460,dmg:D(8),r:6,col:e.c2,life:2.4,src:'e'});}
   sfx('shotgun');break;
  case 'spiral':
   for(let i=0;i<3;i++)G.spinners.push({x:e.x,y:e.y,a:rnd(TAU),spin:2.4,life:2.2,S:S,cd:0,col:e.c2,dmg:D(7)});
   sfx('tesla');break;
  case 'orb':
   for(let i=0;i<3+S;i++){const aa=a+rnd(1,-1);
    shoot({x:e.x,y:e.y,vx:COS(aa)*260,vy:SIN(aa)*260,dmg:D(12),r:8,col:'#b06bff',kind:'missile',homing:2.2,life:3.4,src:'e'});}
   sfx('laser');break;
  case 'teleport':
   burst(e.x,e.y,26,e.c2,300,5,'spark',.5);
   e.x=clamp(p.x+rnd(420,-420),60,G.worldSize-60);e.y=clamp(p.y+rnd(420,-420),60,G.worldSize-60);

/* ================= 12. ITEMS (loot, baús, consumíveis) =============== */
function dropLoot(x,y,e){
 const luck=G.player?G.player.luck||1:1;
 const n=1+FL(rnd(2));
 for(let i=0;i<n;i++)spawnItem('xp',x+rnd(22,-22),y+rnd(22,-22),e.xp);
 if(chance(.02*luck))spawnItem('chest',x,y);
 if(chance(.004*luck))spawnItem('key',x,y);
 if(chance(.006*luck))spawnItem('gem',x,y);
 if(chance(.03))spawnItem(pick(['potion','bomb','shield','clock','magnet','xpm']),x+rnd(16,-16),y+rnd(16,-16));
}
function spawnItem(k,x,y,v){
 G.items.push({k:k,x:x,y:y,v:v||1,seed:rnd(TAU),life:k==='chest'?999:60});
}
function updateItems(dt){
 const p=G.p,mag=(p.stats.magnet||90)+(G.magnetT>0?420:0);
 for(let i=G.items.length-1;i>=0;i--){
  const it=G.items[i];it.life-=dt;
  const d=dst(it.x,it.y,p.x,p.y);
  if(d<mag){const a=Math.atan2(p.y-it.y,p.x-it.x),sp=MX(260,1400-d*2);
   it.x+=COS(a)*sp*dt;it.y+=SIN(a)*sp*dt;}
  if(d<p.r+10||it.life<=0){
   if(it.life>0)pickup(it);
   G.items.splice(i,1);
  }
 }
}
function pickup(it){
 const p=G.p;
 switch(it.k){
  case 'xp':{const v=it.v*G.player.stats.xpMul*(G.xpMulT>0?2:1);addXp(v);G.earned.xp+=v;sfx('xp');
   part({x:it.x,y:it.y,life:.3,size:4,col:'#7cff4f',type:'spark'});break;}
  case 'coin':{const v=it.v*G.player.goldMul;save.stats.coins+=v;G.earned.coins+=v;sfx('coin');break;}
  case 'gem':save.stats.gems++;G.earned.gems+=it.v;sfx('gem');break;
  case 'key':save.stats.keys++;G.earned.keys++;sfx('key');break;
  case 'chest':openChest(it.x,it.y);break;
  case 'potion':healPlayer(p.hpMax*.55);sfx('heal');toast('Poção usada');break;
  case 'bomb':explode(p.x,p.y,260,'#ff5c7a',90);toast('Bomba!');break;
  case 'shield':p.invuln=Math.max(p.invuln,6);toast('Escudo total 6s');sfx('deploy');break;
  case 'clock':G.slowT=6;sfx('clock');toast('Tempo desacelerado');break;
  case 'magnet':G.magnetT=10;sfx('clock');toast('Ímã ativado');break;
  case 'xpm':G.xpMulT=10;sfx('clock');toast('XP em dobro');break;
 }
}
function openChest(x,y){
 sfx('chest');save.stats.chest++;
 burst(x,y,26,'#ffd166',260,4,'spark',.6);
 const luck=G.player?G.player.luck||1:1;
 G.earned.coins+=Math.floor(rndi(40,120)*luck);
 if(chance(.4*luck))G.earned.gems+=rndi(1,4);
 if(chance(.5))G.earned.keys++;
 if(chance(.35)){/* desbloqueia uma arma aleatoria */
  const lock=WKEYS.filter(k=>!save.weapons[k]);
  if(lock.length){const id=pick(lock);save.weapons[id]=1;toast('Nova arma: '+WEAPONS[id].name);}
  else toast('Munição extra');
 }
 if(chance(.15)){save.gems+=2;toast('+2 gemas');}
}

/* ==================== 13. ALLIES (drone/torre/pet) =================== */
function updateAllies(dt){
 const p=G.p;
 for(let i=0;i<G.allies.length;i++){
  const a=G.allies[i];
  a.fireT-=dt;
  if(a.kind==='drone'||a.kind==='pet'){
   const ox=COS(G.simT*1.6+a.i)*(a.kind==='pet'?26:44),oy=SIN(G.simT*1.6+a.i)*(a.kind==='pet'?26:44);
   a.x=lerp(a.x,p.x+ox,dt*6);a.y=lerp(a.y,p.y+oy,dt*6);
  }
  const t=nearestEnemy(a.x,a.y,a.rng);
  if(t){a.a=Math.atan2(t.y-a.y,t.x-a.x);
   if(a.fireT<=0){a.fireT=a.rate;
    shoot({x:a.x,y:a.y,vx:COS(a.a)*820,vy:SIN(a.a)*820,dmg:a.dmg,r:4,col:a.col,life:a.rng/820});
    sfx(a.kind==='turret'?'rifle':'smg');}}
  if(a.kind==='turret'){a.x=lerp(a.x,p.x+a.tx,dt*2);a.y=lerp(a.y,p.y+a.ty,dt*2);}
  else if(!a.tx){a.tx=rnd(50,-50);a.ty=rnd(50,-50);}
 }
 if(G.allies.length&&G.p.slots[G.p.slot]&&WEAPONS[G.p.slots[G.p.slot].id]===undefined){}
}

function addXp(v){
 save.xp+=v;save.pass.xp+=v;
 let need=xpNeed(save.level);
 while(save.xp>=need){
  save.xp-=need;save.level++;save.sp++;save.stats.levels++;
  G.pendingLevels=(G.pendingLevels||0)+1;
  need=xpNeed(save.level);
 }
}
function checkAchievements(){
 ACHS.forEach(a=>{
  if(save.ach[a.id])return;
  let v=0;
  if(a.key==='streak')v=save.login.streak;
  else if(a.key==='account')v=save.level;
  else v=save.stats[a.key]||0;
  if(v>=a.t){save.ach[a.id]=1;toast('🏆 '+a.n);sfx('win');save.stats.gems+=(a.r.g||0);save.coins+=(a.r.c||0);markSave();}
 });
}

}
function checkMissions(){
 MISSIONS.forEach(m=>{
  const cur=Math.min(m.t,save.stats[m.key]-(save.msBase&&save.msBase[m.key]||0));
  if(cur>=m.t&&!save.ms[m.id+'_done']){
   save.ms[m.id+'_done']=1;save.coins+=(m.r.c||0);save.gems+=(m.r.g||0);save.keys+=(m.r.k||0);
   toast('✔ '+m.n);sfx('buy');markSave();

function canLogin(){

 if(!last)return true;
 return t.getDate()!==last.getDate()||t.getMonth()!==last.getMonth()||t.getFullYear()!==last.getFullYear();
}
function doLogin(){

 save.login.streak=last&&daysAgo(last)===1?MX(1,save.login.streak+1):1;

 const r=LOGIN_R[(save.login.streak-1)%LOGIN_R.length];
