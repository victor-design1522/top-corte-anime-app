<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOP CORTE ANIME - Completo</title>
    <style>
        :root {
            --bg-main: #0b0b0f;
            --bg-card: #15151f;
            --primary: #7b2cbf;
            --neon: #9d4edd;
            --text: #f8f9fa;
            --text-muted: #adb5bd;
            --danger: #e63946;
            --success: #2a9d8f;
        }

        .light {
            --bg-main: #f4f4f9;
            --bg-card: #ffffff;
            --primary: #5a189a;
            --neon: #7b2cbf;
            --text: #212529;
            --text-muted: #6c757d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: background 0.3s, color 0.3s; }
        body { background-color: var(--bg-main); color: var(--text); min-height: 100vh; padding-bottom: 50px; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; background: rgba(15, 15, 25, 0.95);
            backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 1000;
            border-bottom: 1px solid rgba(157, 78, 221, 0.2);
        }

        .logo { font-size: 18px; font-weight: bold; color: var(--text); cursor: pointer; }
        .logo span { color: var(--neon); text-shadow: 0 0 10px var(--neon); }

        .nav-actions { display: flex; gap: 8px; align-items: center; }
        input, select, textarea {
            background: var(--bg-card); border: 1px solid rgba(255,255,255,0.1);
            padding: 8px 12px; border-radius: 8px; color: var(--text); outline: none; font-size: 14px; width: 100%;
        }

        .search-box { width: 130px; border-radius: 20px; }
        @media(min-width: 600px) { .search-box { width: 200px; } }

        button { cursor: pointer; border: none; border-radius: 8px; padding: 8px 14px; font-weight: bold; font-size: 14px; }
        .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 0 10px rgba(123, 44, 191, 0.4); }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-success { background: var(--success); color: #fff; }
        .btn-icon { background: var(--bg-card); color: var(--text); padding: 8px; border-radius: 50%; }

        .container { padding: 20px; max-width: 1200px; margin: 0 auto; }
        h2 { margin-bottom: 15px; border-left: 4px solid var(--neon); padding-left: 10px; font-size: 18px; }

        /* Grades e Cards */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; }
        @media(min-width: 600px) { .grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); } }

        .card {
            background: var(--bg-card); border-radius: 10px; overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); cursor: pointer; position: relative;
        }
        .card img { width: 100%; height: 180px; object-fit: cover; }
        @media(min-width: 600px) { .card img { height: 250px; } }
        .card-info { padding: 10px; }
        .card-info h3 { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-info p { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

        /* Páginas / Telas */
        .page { display: none; }
        .page.active { display: block; }

        /* Página de Detalhes */
        .anime-header { display: flex; flex-direction: column; gap: 20px; }
        @media(min-width: 768px) { .anime-header { flex-direction: row; } }
        .anime-poster { width: 100%; max-width: 250px; border-radius: 10px; object-fit: cover; margin: 0 auto; }
        .episodes-list { display: flex; flex-direction: column; gap: 8px; margin-top: 15px; max-height: 250px; overflow-y: auto; }
        .ep-item { background: var(--bg-card); padding: 10px 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .ep-item:hover { border: 1px solid var(--neon); }

        /* Player */
        .player-container { width: 100%; background: #000; border-radius: 10px; overflow: hidden; position: relative; aspect-ratio: 16/9; margin-bottom: 15px; }
        .player-container iframe, .player-container video { width: 100%; height: 100%; border: none; }

        /* Painel Admin */
        .admin-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        .admin-table th, .admin-table td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); text-align: left; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="mudarPagina('home')">TOP CORTE <span>ANIME</span></div>
        <div class="nav-actions">
            <input type="text" id="global-search" class="search-box" placeholder="Pesquisar..." oninput="filtrarAnimes(this.value)">
            <button class="btn-icon" onclick="alternarTema()"></button>
            <button class="btn-primary" onclick="mudarPagina('admin-login')">ADM</button>
        </div>
    </header>

    <div class="container">

        <!-- 1. PÁGINA INICIAL -->
        <div id="page-home" class="page active">
            <div style="margin-bottom: 25px; background: linear-gradient(135deg, var(--primary), #240046); padding: 25px; border-radius: 15px;">
                <h1 id="destaque-titulo" style="font-size: 24px; margin-bottom: 8px;">Carregando Destaque...</h1>
                <p id="destaque-sinopse" style="font-size: 13px; color: #ddd; margin-bottom: 15px; max-width: 600px;"></p>
                <button class="btn-primary" id="btn-destaque-assistir"> Assistir Destaque</button>
            </div>

            <div id="secao-continue" style="margin-bottom: 30px; display: none;">
                <h2> Continue Assistindo</h2>
                <div class="grid" id="grid-continue"></div>
            </div>

            <div style="margin-bottom: 30px;">
                <h2> Seus Favoritos</h2>
                <div class="grid" id="grid-favoritos"><p style="color: var(--text-muted); font-size: 13px;">Nenhum favorito salvo.</p></div>
            </div>

            <h2> Catálogo Completo</h2>
            <div class="grid" id="grid-catalogo"></div>
        </div>

        <!-- 2. PÁGINA DE DETALHES DO ANIME -->
        <div id="page-anime" class="page">
            <button onclick="mudarPagina('home')" style="margin-bottom: 15px; background: transparent; color: var(--neon);"> Voltar</button>
            <div class="anime-header">
                <img id="detalhe-capa" class="anime-poster" src="" alt="">
                <div>
                    <h1 id="detalhe-titulo" style="font-size: 22px; margin-bottom: 5px;"></h1>
                    <p id="detalhe-info" style="color: var(--text-muted); font-size: 13px; margin-bottom: 10px;"></p>
                    <p id="detalhe-sinopse" style="font-size: 14px; line-height: 1.5; margin-bottom: 15px;"></p>
                    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                        <button class="btn-primary" id="btn-favoritar" onclick="toggleFavoritoAtual()"> Favoritar</button>
                    </div>
                </div>
            </div>

            <div style="margin-top: 25px;">
                <h2> Episódios</h2>
                <div class="episodes-list" id="detalhe-episodios"></div>
            </div>
        </div>

        <!-- 3. PÁGINA DO PLAYER -->
        <div id="page-player" class="page">
            <button id="btn-voltar-anime" style="margin-bottom: 10px; background: transparent; color: var(--neon);"> Voltar ao Anime</button>
            <h2 id="player-titulo-ep" style="font-size: 16px; margin-bottom: 10px;"></h2>
            <div class="player-container">
                <iframe id="video-iframe" src="" allowfullscreen></iframe>
            </div>
            <div style="display: flex; justify-content: space-between; margin-top: 15px;">
                <button class="btn-primary" onclick="episodioAnterior()"> Ep. Anterior</button>
                <button class="btn-primary" onclick="proximoEpisodio()">Próximo Ep. </button>
            </div>
        </div>

        <!-- 4. PAINEL ADMINISTRATIVO (LOGIN) -->
        <div id="page-admin-login" class="page">
            <div style="max-width: 350px; margin: 40px auto; background: var(--bg-card); padding: 25px; border-radius: 12px; border: 1px solid var(--neon);">
                <h2 style="margin-bottom: 15px; color: var(--neon);">Painel ADM</h2>
                <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 15px;">só para o dono</p>
                <div class="form-group"><label>Usuário</label><input type="text" id="adm-user"></div>
                <div class="form-group"><label>Senha</label><input type="password" id="adm-pass"></div>
                <button class="btn-primary" style="width: 100%; margin-top: 10px;" onclick="fazerLoginAdmin()">Entrar</button>
                <button style="width: 100%; margin-top: 10px; background: transparent; color: var(--text-muted);" onclick="mudarPagina('home')">Cancelar</button>
            </div>
        </div>

        <!-- 5. PAINEL ADMINISTRATIVO (GERENCIAMENTO REAL) -->
        <div id="page-admin-painel" class="page">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2> Gerenciamento de Animes</h2>
                <div style="display: flex; gap: 10px;">
                    <button class="btn-success" onclick="abrirModalAnime()">+ Adicionar Anime</button>
                    <button class="btn-danger" onclick="mudarPagina('home')">Sair</button>
                </div>
            </div>
            <div style="overflow-x: auto; background: var(--bg-card); border-radius: 10px; padding: 15px;">
                <table class="admin-table">
                    <thead><tr><th>Título</th><th>Ano</th><th>Ações</th></tr></thead>
                    <tbody id="admin-tabela-corpo"></tbody>
                </table>
            </div>
        </div>

        <!-- MODAL DE ADICIONAR / EDITAR ANIME -->
        <div id="modal-anime" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; padding: 20px; overflow-y: auto;">
            <div style="max-width: 450px; margin: 30px auto; background: var(--bg-card); padding: 25px; border-radius: 12px;">
                <h2 id="modal-titulo" style="margin-bottom: 15px;">Novo Anime</h2>
                <input type="hidden" id="edit-id">
                <div class="form-group"><label>Título</label><input type="text" id="form-titulo"></div>
                <div class="form-group"><label>Link da Capa (Imagem)</label><input type="text" id="form-capa"></div>
                <div class="form-group"><label>Ano</label><input type="text" id="form-ano"></div>
                <div class="form-group"><label>Nota (Ex: 9.5)</label><input type="text" id="form-nota"></div>
                <div class="form-group"><label>Sinopse</label><textarea id="form-sinopse" rows="3"></textarea></div>
                
                <div class="form-group">
                    <label>Episódios (Links dos Vídeos separados por vírgula ou um por linha)</label>
                    <textarea id="form-eps" rows="3" placeholder="https://www.youtube.com/embed/exemplo1, https://www.youtube.com/embed/exemplo2"></textarea>
                </div>

                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <button class="btn-primary" style="flex: 1;" onclick="salvarAnimeBD()">Salvar</button>
                    <button class="btn-danger" style="flex: 1;" onclick="fecharModalAnime()">Cancelar</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // BANCO DE DADOS LOCAL PERSISTENTE (LocalStorage)
        const DB_KEY = "top_corte_animes_db";
        const FAV_KEY = "top_corte_favs_db";
        const HIST_KEY = "top_corte_hist_db";

        let animesPadrao = [
            {
                id: "1",
                titulo: "Solo Leveling",
                capa: "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=300&auto=format&fit=crop&q=60",
                ano: "2024",
                nota: "9.5",
                sinopse: "Em um mundo onde portais conectam monstros, o caçador mais fraco ganha uma segunda chance misteriosa.",
                episodios: [
                    { titulo: "Episódio 1: O Despertar", link: "https://www.youtube.com/embed/dQw4w9WgXcQ" },
                    { titulo: "Episódio 2: Se eu tivesse mais uma chance", link: "https://www.youtube.com/embed/dQw4w9WgXcQ" }
                ]
            },
            {
                id: "2",
                titulo: "Jujutsu Kaisen",
                capa: "https://images.unsplash.com/photo-1578632767115-351597cf2477?w=300&auto=format&fit=crop&q=60",
                ano: "2023",
                nota: "9.2",
                sinopse: "Sofrimento, regretos e maldições compõem a vida daqueles que absorvem energias amaldiçoadas.",
                episodios: [
                    { titulo: "Episódio 1: Ryomen Sukuna", link: "https://www.youtube.com/embed/dQw4w9WgXcQ" },
                    { titulo: "Episódio 2: Para si mesmo", link: "https://www.youtube.com/embed/dQw4w9WgXcQ" }
                ]
            }
        ];

        function getAnimes() {
            let dados = localStorage.getItem(DB_KEY);
            if (!dados) {
                localStorage.setItem(DB_KEY, JSON.stringify(animesPadrao));
                return animesPadrao;
            }
            return JSON.parse(dados);
        }

        function salvarAnimes(lista) {
            localStorage.setItem(DB_KEY, JSON.stringify(lista));
        }

        let animeAtualId = null;
        let epAtualIndex = 0;

        // CONTROLE DE TELAS
        function mudarPagina(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active');
            window.scrollTo(0,0);
            if(pageId === 'home') carregarHome();
            if(pageId === 'admin-painel') carregarTabelaAdmin();
        }

        // TEMA
        function alternarTema() {
            document.documentElement.classList.toggle('dark');
            document.documentElement.classList.toggle('light');
        }

        // RENDERIZAR HOME
        function carregarHome() {
            let animes = getAnimes();
            let grid = document.getElementById('grid-catalogo');
            
            if(animes.length > 0) {
                let d = animes[0];
                document.getElementById('destaque-titulo').innerText = d.titulo;
                document.getElementById('destaque-sinopse').innerText = d.sinopse;
                document.getElementById('btn-destaque-assistir').onclick = () => abrirDetalhes(d.id);
            }

            grid.innerHTML = animes.map(a => `
                <div class="card" onclick="abrirDetalhes('${a.id}')">
                    <img src="${a.capa}" alt="${a.titulo}">
                    <div class="card-info">
                        <h3>${a.titulo}</h3>
                        <p> ${a.nota} • ${a.ano}</p>
                    </div>
                </div>
            `).join('');

            carregarFavoritosNaHome();
            carregarContinueAssistindo();
        }

        function filtrarAnimes(termo) {
            let animes = getAnimes();
            let filtrados = animes.filter(a => a.titulo.toLowerCase().includes(termo.toLowerCase()));
            let grid = document.getElementById('grid-catalogo');
            grid.innerHTML = filtrados.map(a => `
                <div class="card" onclick="abrirDetalhes('${a.id}')">
                    <img src="${a.capa}" alt="${a.titulo}">
                    <div class="card-info">
                        <h3>${a.titulo}</h3>
                        <p> ${a.nota} • ${a.ano}</p>
                    </div>
                </div>
            `).join('');
        }

        // DETALHES DO ANIME
        function abrirDetalhes(id) {
            let animes = getAnimes();
            let anime = animes.find(a => a.id === id);
            if(!anime) return;

            animeAtualId = id;
            document.getElementById('detalhe-capa').src = anime.capa;
            document.getElementById('detalhe-titulo').innerText = anime.titulo;
            document.getElementById('detalhe-info').innerText = `Nota:  ${anime.nota} | Ano: ${anime.ano}`;
            document.getElementById('detalhe-sinopse').innerText = anime.sinopse;

            atualizarBotaoFavoritoUI();

            let listaEps = document.getElementById('detalhe-episodios');
            if(!anime.episodios || anime.episodios.length === 0) {
                listaEps.innerHTML = `<p style="color:var(--text-muted);">Nenhum episódio cadastrado.</p>`;
            } else {
                listaEps.innerHTML = anime.episodios.map((ep, idx) => `
                    <div class="ep-item" onclick="assistirEpisodio('${anime.id}', ${idx})">
                        <span>${ep.titulo}</span>
                        <span></span>
                    </div>
                `).join('');
            }

            mudarPagina('anime');
        }

        // PLAYER DE VÍDEO & HISTÓRICO
        function assistirEpisodio(animeId, epIdx) {
            let animes = getAnimes();
            let anime = animes.find(a => a.id === animeId);
            if(!anime || !anime.episodios[epIdx]) return;

            animeAtualId = animeId;
            epAtualIndex = epIdx;
            let ep = anime.episodios[epIdx];

            document.getElementById('player-titulo-ep').innerText = `${anime.titulo} - ${ep.titulo}`;
            document.getElementById('video-iframe').src = ep.link;
            document.getElementById('btn-voltar-anime').onclick = () => abrirDetalhes(animeId);

            // Salvar Histórico / Continue Assistindo
            let historico = JSON.parse(localStorage.getItem(HIST_KEY)) || [];
            historico = historico.filter(h => h.animeId !== animeId);
            historico.unshift({ animeId, animeTitulo: anime.titulo, capa: anime.capa, epIdx, epTitulo: ep.titulo });
            localStorage.setItem(HIST_KEY, JSON.stringify(historico));

            mudarPagina('player');
        }

        function proximoEpisodio() {
            let animes = getAnimes();
            let anime = animes.find(a => a.id === animeAtualId);
            if(anime && anime.episodios[epAtualIndex + 1]) {
                assistirEpisodio(animeAtualId, epAtualIndex + 1);
            } else {
                alert("Este é o último episódio!");
            }
        }

        function episodioAnterior() {
            if(epAtualIndex > 0) {
                assistirEpisodio(animeAtualId, epAtualIndex - 1);
            } else {
                alert("Você já está no primeiro episódio!");
            }
        }

        function carregarContinueAssistindo() {
            let historico = JSON.parse(localStorage.getItem(HIST_KEY)) || [];
            let secao = document.getElementById('secao-continue');
            let grid = document.getElementById('grid-continue');

            if(historico.length === 0) {
                secao.style.display = 'none';
                return;
            }

            secao.style.display = 'block';
            grid.innerHTML = historico.map(h => `
                <div class="card" onclick="assistirEpisodio('${h.animeId}', ${h.epIdx})">
                    <img src="${h.capa}" alt="${h.animeTitulo}">
