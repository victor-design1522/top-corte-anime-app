<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>💜 Romance Anime Dublado</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#080808;
    color:white;
}

/* TOPO */

header{
    background:linear-gradient(90deg,#8b00ff,#ff0080);
    padding:20px;
    text-align:center;
    box-shadow:0 0 30px #ff0080;
}

header h1{
    font-size:32px;
    font-weight:800;
}

header p{
    margin-top:5px;
}


/* CONTAINER */

.container{
    max-width:1400px;
    margin:auto;
    padding:30px;
}


/* TITULO */

.titulo{
    font-size:28px;
    margin-bottom:25px;
    color:#ff66cc;
}


/* GRID DOS ANIMES */

.catalogo{

    display:grid;

    grid-template-columns:
    repeat(auto-fill,minmax(180px,1fr));

    gap:25px;

}


/* CARD */

.card{

    background:#151515;
    border-radius:15px;
    overflow:hidden;
    cursor:pointer;
    transition:.3s;
    border:1px solid #333;

}


.card:hover{

    transform:translateY(-10px);

    box-shadow:
    0 0 20px #ff0080;

    border-color:#ff0080;

}


/* IMAGEM */

.card img{

    width:100%;
    height:260px;
    object-fit:cover;

}


/* INFORMAÇÕES */

.info{

    padding:15px;

}


.info h2{

    font-size:18px;
    color:#fff;

}


.info span{

    display:block;
    color:#bbb;
    font-size:13px;
    margin-top:5px;

}


/* TAG */

.tag{

    display:inline-block;

    background:#ff0080;

    padding:5px 10px;

    border-radius:20px;

    font-size:12px;

    margin-top:10px;

}


/* MOBILE */

@media(max-width:600px){

.catalogo{

grid-template-columns:
repeat(2,1fr);

}


.card img{

height:220px;

}

}

</style>

</head>


<body>


<header>

<h1>💜 ROMANCE ANIME</h1>

<p>Catálogo completo de animes de romance dublados</p>

</header>



<div class="container">


<h2 class="titulo">
❤️ Todos os Animes de Romance
</h2>


<div class="catalogo" id="catalogo">


<!-- OS ANIMES VÃO ENTRAR AQUI -->


</div>


</div>



<script>


const animes = [


/* OS ANIMES VÃO SER COLOCADOS NA PARTE 2 */


];



const catalogo =
document.getElementById("catalogo");



animes.forEach(anime=>{


catalogo.innerHTML += `


<div class="card">


<img src="${anime.capa}">


<div class="info">


<h2>${anime.nome}</h2>


<span>📅 ${anime.ano}</span>

<span>🎬 ${anime.ep} episódios</span>

<span>🎙️ ${anime.dublado}</span>


<div class="tag">

${anime.genero}

</div>


</div>


</div>


`;


});


</script>


</body>

</html>
