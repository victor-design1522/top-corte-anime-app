<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOP CORTE ANIME</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0d0d0d;
color:#fff;
}

header{
background:#6a00ff;
padding:18px;
text-align:center;
box-shadow:0 0 20px #6a00ff;
}

header h1{
font-size:30px;
}

.search{
padding:20px;
}

.search input{
width:100%;
padding:15px;
border:none;
border-radius:12px;
font-size:16px;
background:#1c1c1c;
color:#fff;
}

.titulo{
padding:0 20px;
margin-bottom:15px;
font-size:22px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
gap:15px;
padding:20px;
}

.card{
background:#1c1c1c;
border-radius:12px;
overflow:hidden;
transition:.3s;
cursor:pointer;
border:2px solid #6a00ff;
}

.card:hover{
transform:scale(1.05);
}

.card a{
text-decoration:none;
color:#fff;
display:block;
}

.card img{
width:100%;
height:220px;
object-fit:cover;
}

.card h3{
padding:10px 10px 5px;
text-align:center;
font-size:16px;
}

.card p{
text-align:center;
font-size:14px;
color:#ccc;
padding-bottom:6px;
}
</style>

</head>

<body>

<header>
<h1>🎬 TOP CORTE ANIME</h1>
</header>

<div class="search">
<input type="text" placeholder="Pesquisar anime...">
</div>

<h2 class="titulo">🔥 Meus Cortes</h2>

<div class="grid">

<div class="card">
<a href="#" onclick="abrirSolo(); return false;">
<img src="img/solo.jpg" alt="Solo Leveling">
<h3>Solo Leveling</h3>
<p>📺 2 Temporadas</p>
<p>🎬 25 Episódios</p>
</a>
</div>

<div class="card">
<a href="anime.html">
<img src="img/violet.jpg" alt="Violet Evergarden">
<h3>Violet Evergarden</h3>
<p>📺 1 Temporada</p>
<p>🎬 13 Episódios</p>
</a>
</div>

<div class="card">
<a href="anime.html">
<img src="img/seijo.jpg" alt="Seijo no Maryoku">
<h3>Seijo no Maryoku</h3>
<p>📺 2 Temporadas</p>
<p>🎬 24 Episódios</p>
</a>
</div>

<div class="card">
<a href="anime.html">
<img src="img/naruto.jpg" alt="Naruto">
<h3>Naruto</h3>
<p>📺 5 Temporadas</p>
<p>🎬 220 Episódios</p>
</a>
</div>

</div>
<div id="soloPage" style="display:none;padding:20px;">

<h2 style="text-align:center;">🎬 Solo Leveling</h2>

<img src="img/solo.jpg" style="width:220px;display:block;margin:auto;border-radius:15px;">

<p style="text-align:center;margin-top:15px;">
📺 2 Temporadas<br>
🎬 25 Episódios
</p>

<button onclick="assistirSolo()" style="width:100%;padding:15px;margin-top:20px;background:#6a00ff;color:white;border:none;border-radius:10px;font-size:18px;">
▶ Episódio 1
</button>

<br><br>

<video id="videoSolo" controls style="width:100%;display:none;border-radius:12px;">
<source src="videos/solo-ep1.mp4" type="video/mp4">
</video>

<br><br>

<button onclick="voltarInicio()" style="width:100%;padding:15px;background:#333;color:white;border:none;border-radius:10px;">
⬅ Voltar
</button>

</div>

<script>
function abrirSolo(){
document.querySelector(".grid").style.display="none";
document.querySelector(".titulo").style.display="none";
document.querySelector(".search").style.display="none";
document.getElementById("soloPage").style.display="block";
window.scrollTo(0,0);
}

function assistirSolo(){
const video=document.getElementById("videoSolo");
video.style.display="block";
video.play();
}

function voltarInicio(){
document.getElementById("soloPage").style.display="none";
document.querySelector(".grid").style.display="grid";
document.querySelector(".titulo").style.display="block";
document.querySelector(".search").style.display="block";
}
  </script>
  
</body>
</html>
