<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOP CORTE ANIME</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0d0d0d;
color:#fff;
}

header{
background:#6a00ff;
padding:18px;
text-align:center;
box-shadow:0 0 20px #6a00ff;
}

header h1{
font-size:30px;
}

.search{
padding:20px;
}

.search input{
width:100%;
padding:15px;
border:none;
border-radius:12px;
font-size:16px;
background:#1c1c1c;
color:#fff;
}

.titulo{
padding:0 20px;
margin-bottom:15px;
font-size:22px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
gap:15px;
padding:20px;
}

.card{
background:#1c1c1c;
border-radius:12px;
overflow:hidden;
transition:.3s;
cursor:pointer;
border:2px solid #6a00ff;
}

.card:hover{
transform:scale(1.05);
}

.card img{
width:100%;
height:220px;
object-fit:cover;
}

.card h3{
padding:10px;
text-align:center;
font-size:16px;
}
</style>

</head>

<body>

<header>
<h1>🎬 TOP CORTE ANIME</h1>
</header>

<div class="search">
<input type="text" placeholder="Pesquisar anime...">
</div>

<h2 class="titulo">🔥 Meus Cortes</h2>

<div class="grid">

<div class="card">
<a href="anime.html">
<img src="img/solo.jpg">
<h3>Solo Leveling</h3>
</a>
</div>

<div class="card">
<a href="anime.html">
<img src="img/violet.jpg">
<h3>Violet Evergarden</h3>
</a>
</div>

<div class="card">
<a href="anime.html">
<img src="img/seijo.jpg">
<h3>Seijo no Maryoku</h3>
</a>
</div>

<div class="card">
<a href="anime.html">
<img src="img/naruto.jpg">
<h3>Naruto</h3>
</a>
</div>

</div>

</body>
</html>
