<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💜 TOP CORTE ANIME ROMANCE DUBLADO</title>
    
    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* =========================================
           CONFIGURAÇÕES VISUAIS E NEON
           ========================================= */
        :root {
            --bg-main: #09090b;
            --bg-card: #18181b;
            --bg-card-hover: #27272a;
            --neon-pink: #ff2a85;
            --neon-purple: #9d4edd;
            --text-main: #f8fafc;
            --text-sec: #a1a1aa;
            --glow-pink: rgba(255, 42, 133, 0.5);
            --glow-purple: rgba(157, 78, 221, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb { 
            background: linear-gradient(var(--neon-pink), var(--neon-purple)); 
            border-radius: 10px; 
        }

        /* Efeitos Neon */
        .text-neon {
            background: linear-gradient(to right, var(--neon-pink), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 42, 133, 0.3);
        }

        /* =========================================
           CABEÇALHO
           ========================================= */
        header {
            background: rgba(9, 9, 11, 0.9);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 42, 133, 0.2);
            padding: 15px 0;
            box-shadow: 0 4px 30px rgba(0,0,0,0.5);
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .logo i { color: var(--neon-pink); }

        nav ul {
            display: flex;
            gap: 20px;
            list-style: none;
        }

        nav button {
            background: transparent;
            border: none;
            color: var(--text-sec);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        nav button:hover, nav button.active {
            color: var(--neon-pink);
            text-shadow: 0 0 10px var(--glow-pink);
        }

        /* =========================================
           FILTROS E PESQUISA
           ========================================= */
        .controls-section {
            margin: 30px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: space-between;
            align-items: center;
            background: rgba(24, 24, 27, 0.6);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(157, 78, 221, 0.2);
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 20px 12px 45px;
            background: #09090b;
            border: 1px solid var(--neon-purple);
            border-radius: 25px;
            color: #fff;
            outline: none;
            transition: 0.3s;
        }

        .search-box input:focus {
            box-shadow: 0 0 15px var(--glow-purple);
        }

        .search-box i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--neon-purple);
        }

        select {
            padding: 12px 20px;
            background: #09090b;
            color: #fff;
            border: 1px solid var(--neon-pink);
            border-radius: 25px;
            outline: none;
            cursor: pointer;
        }

        .badges-top {
            display: flex;
            gap: 10px;
            align-items: center;
            font-size: 0.9rem;
            color: var(--text-sec);
        }

        .badge-dub {
            background: linear-gradient(45deg, var(--neon-purple), var(--neon-pink));
            padding: 5px 10px;
            border-radius: 8px;
            color: #fff;
            font-weight: bold;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        /* =========================================
           CATÁLOGO E CARDS
           ========================================= */
        .grid-animes {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
            padding-bottom: 50px;
        }

        .card {
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: 0.4s;
            border: 1px solid transparent;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: var(--neon-pink);
            box-shadow: 0 10px 25px rgba(255, 42, 133, 0.2);
        }

        .card-img {
            width: 100%;
            height: 320px;
            object-fit: cover;
            transition: 0.4s;
        }

        .card:hover .card-img { filter: brightness(1.1); }

        .btn-fav {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.6);
            border: 1px solid var(--neon-pink);
            color: #fff;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s;
            z-index: 10;
        }

        .btn-fav.active, .btn-fav:hover {
            background: var(--neon-pink);
            box-shadow: 0 0 10px var(--neon-pink);
        }

        .card-info {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 10px;
            line-height: 1.2;
            color: #fff;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-sec);
        }
        
        .card-meta i { color: #facc15; }

        /* =========================================
           PÁGINA DE DETALHES
           ========================================= */
        #detalhes-view {
            display: none;
            padding: 30px 0 60px 0;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .btn-voltar {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--text-sec);
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            margin-bottom: 20px;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-voltar:hover {
            border-color: var(--neon-purple);
            color: var(--neon-purple);
        }

        .detalhes-container {
            display: flex;
            gap: 40px;
            background: var(--bg-card);
            padding: 30px;
            border-radius: 15px;
            border: 1px solid rgba(157, 78, 221, 0.3);
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }

        .detalhes-img {
            width: 300px;
            border-radius: 12px;
            box-shadow: 0 0 20px var(--glow-pink);
            object-fit: cover;
        }

        .detalhes-info h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            line-height: 1.1;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tag {
            background: rgba(255, 42, 133, 0.1);
            border: 1px solid var(--neon-pink);
            color: var(--neon-pink);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            background: #09090b;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .info-item span { color: var(--text-sec); font-size: 0.9rem; }
        .info-item p { font-weight: 600; font-size: 1rem; color: #fff; }

        .secao-texto { margin-bottom: 25px; }
        .secao-texto h3 {
            color: var(--neon-purple);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .secao-texto p { color: #d4d4d8; line-height: 1.6; font-size: 0.95rem; }

        /* Responsivo */
        @media (max-width: 800px) {
            .detalhes-container { flex-direction: column; align-items: center; text-align: center; }
            .detalhes-img { width: 100%; max-width: 300px; }
            .info-grid { grid-template-columns: 1fr; text-align: left; }
            .secao-texto h3 { justify-content: center; }
            @media (max-width: 800px) { .secao-texto { text-align: left; } .secao-texto h3 { justify-content: flex-start; } }
        }
    </style>
</head>
