<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TOP CORTE ANIME</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}


body{

    background:#080808;
    color:white;

}



/* CABEÇALHO */

header{

    background:linear-gradient(90deg,#6a00ff,#9b00ff);

    padding:25px;

    text-align:center;

    box-shadow:0 0 25px #6a00ff;

}


header h1{

    font-size:32px;

}



header p{

    margin-top:8px;

    color:#ddd;

}





/* PESQUISA */

.search{

    padding:20px;

}



.search input{

    width:100%;

    padding:16px;

    border-radius:15px;

    border:none;

    outline:none;

    background:#1c1c1c;

    color:white;

    font-size:16px;

}





/* TITULO */

.titulo{

    padding:0 20px;

    margin-bottom:10px;

    font-size:24px;

}





/* GRID DOS CARDS */

.grid{

    display:grid;

    grid-template-columns:repeat(auto-fill,minmax(170px,1fr));

    gap:20px;

    padding:20px;

}





/* CARD */

.card{

    background:#151515;

    border:2px solid #6a00ff;

    border-radius:15px;

    overflow:hidden;

    cursor:pointer;

    transition:.3s;

}



.card:hover{

    transform:scale(1.05);

    box-shadow:0 0 20px #6a00ff;

}





.card img{

    width:100%;

    height:240px;

    object-fit:cover;

}





.card h3{

    text-align:center;

    padding:12px 5px;

    font-size:17px;

}





.card p{

    text-align:center;

    color:#ccc;

    font-size:14px;

    padding-bottom:8px;

}





/* PAGINA DE INFORMAÇÃO */

#animePage{

    display:none;

    padding:20px;

}





.capa{

    width:230px;

    display:block;

    margin:auto;

    border-radius:15px;

}





.info{

    background:#151515;

    border:2px solid #6a00ff;

    border-radius:15px;

    padding:20px;

    margin-top:20px;

}





.info h3{

    margin-bottom:15px;

}





.info p{

    margin:10px 0;

    color:#ddd;

}





button{

    width:100%;

    padding:15px;

    margin-top:20px;

    border:none;

    border-radius:12px;

    background:#6a00ff;

    color:white;

    font-size:18px;

    cursor:pointer;

}



button:hover{

    background:#8500ff;

}


</style>

</head>
